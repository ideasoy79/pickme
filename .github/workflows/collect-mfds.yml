name: 픽미닷 데이터 수집 (식약처)

on:
  # 화면에서 손으로 실행할 때
  workflow_dispatch:
    inputs:
      pages:
        description: '가져올 페이지 수 (1페이지=100건, 0을 넣으면 전체 약 2,050페이지)'
        required: true
        default: '5'
      since:
        description: '이 연도 이후에 보고된 것만 남김'
        required: true
        default: '2021'
      start_page:
        description: '이어받기 시작 페이지 (처음부터면 1. 하루 한도로 멈췄을 때만 숫자를 넣으세요)'
        required: false
        default: '1'
  # 매주 월요일 새벽 4시(한국시간)에 저절로
  schedule:
    - cron: '0 19 * * 0'

permissions:
  contents: write

concurrency:
  group: collect-mfds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 식약처 자료 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PAGES: ${{ github.event.inputs.pages || '0' }}
          SINCE: ${{ github.event.inputs.since || '2021' }}
          START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          ROWS: '100'
          SLEEP: '0.4'
        run: python tools/collect_mfds.py

      - name: 결과 저장
        run: |
          git config user.name 'pickme-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "식약처 데이터 자동 갱신 $(date -u -d '+9 hours' +'%Y-%m-%d')"
            git push
          fi
