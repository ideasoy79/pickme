<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDFB">
<meta name="description" content="PickMe. 나도 모르는 나의 구매 기준을 찾아주는 쇼핑 큐레이터">
<title>PickMe.</title>
<style>
:root{
  --bg:#FFFDFB; --card:#FFFFFF; --line:#EFE7E0; --line2:#E4D8CE;
  --ink:#2B2320; --ink2:#6B5D55; --ink3:#9C8E86;
  --accent:#D9694A; --accent-soft:#FBEDE8; --accent-line:#F0C9BC;
  --shadow:0 1px 2px rgba(43,35,32,.04), 0 8px 24px rgba(43,35,32,.06);
  --nav:56px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg);}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink); font-size:16px; line-height:1.62;
  -webkit-font-smoothing:antialiased; word-break:keep-all;
}
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:0; cursor:pointer;}
input{font-family:inherit; font-size:inherit; color:inherit;}
.wrap{max-width:520px; margin:0 auto; padding:0 20px calc(40px + env(safe-area-inset-bottom));}

/* 표준 내비게이션 바 */
.nav{
  position:sticky; top:0; z-index:40; height:var(--nav);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,253,251,.92); backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line); padding:0 6px;
}
.nav-btn{width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:12px;}
.nav-btn:active{background:var(--accent-soft);}
.nav-title{font-size:15px; font-weight:600; letter-spacing:-.01em;}
.nav-ghost{width:44px; height:44px;}
.ico{width:20px; height:20px; display:block; stroke:var(--ink); stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round;}

/* 진행 표시 */
.prog{height:2px; background:var(--line); position:relative; overflow:hidden;}
.prog span{position:absolute; left:0; top:0; bottom:0; background:var(--accent); transition:width .28s ease;}

/* 타이포 */
.eyebrow{font-size:12px; letter-spacing:.14em; color:var(--accent); font-weight:700; text-transform:uppercase;}
h1.t{font-size:27px; line-height:1.38; font-weight:700; letter-spacing:-.025em; margin:14px 0 0;}
h2.t{font-size:21px; line-height:1.45; font-weight:700; letter-spacing:-.02em; margin:0 0 8px;}
h3.t{font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0 0 6px;}
p.s{color:var(--ink2); font-size:15px; margin:10px 0 0;}
p.xs{color:var(--ink3); font-size:13px; line-height:1.6; margin:8px 0 0;}
.sec{margin-top:34px;}
.divider{height:1px; background:var(--line); margin:28px 0;}

/* 카드 */
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
.card.hi{border-color:var(--accent-line); background:linear-gradient(180deg,#FFF9F6 0%,#FFFFFF 60%);}

/* 버튼 */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:54px; border-radius:15px; font-weight:700; font-size:16px;
  background:var(--accent); color:#fff; letter-spacing:-.01em; transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.985); opacity:.92;}
.btn[disabled]{background:var(--line2); color:#fff; opacity:.7;}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line2);}
.btn.soft{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);}
.btn.sm{min-height:46px; font-size:15px; border-radius:13px;}
.btnrow{display:flex; gap:10px; margin-top:12px;}
.sticky{position:sticky; bottom:0; padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,253,251,0) 0%,var(--bg) 34%);}

/* 선택지 */
.opt{
  display:block; width:100%; text-align:left; min-height:60px; padding:15px 17px; margin-top:10px;
  background:#fff; border:1px solid var(--line2); border-radius:15px; transition:border-color .14s ease, background .14s ease;
}
.opt:active{background:var(--accent-soft);}
.opt.on{border-color:var(--accent); background:var(--accent-soft);}
.opt .ot{font-weight:600; letter-spacing:-.01em;}
.opt .oh{display:block; font-size:13px; color:var(--ink3); margin-top:3px;}

/* 칩 */
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.chip{padding:9px 15px; min-height:44px; display:inline-flex; align-items:center;
  border:1px solid var(--line2); border-radius:999px; font-size:14px; font-weight:600; background:#fff;}
.chip.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.tag{display:inline-block; padding:4px 10px; border-radius:999px; background:var(--accent-soft);
  color:var(--accent); font-size:12px; font-weight:700; margin:0 6px 6px 0;}
.tag.n{background:#F4F1EE; color:var(--ink2);}

/* 입력 */
.field{width:100%; min-height:54px; padding:15px 17px; background:#fff;
  border:1px solid var(--line2); border-radius:15px; outline:none;}
.field:focus{border-color:var(--accent);}

/* 축 막대 */
.axis{margin-top:14px;}
.axis-top{display:flex; justify-content:space-between; align-items:baseline; font-size:14px;}
.axis-top b{font-weight:700;}
.axis-top span{color:var(--ink3); font-size:13px;}
.bar{height:7px; border-radius:999px; background:#F1EAE4; margin-top:7px; overflow:hidden;}
.bar i{display:block; height:100%; border-radius:999px; background:var(--accent);}

/* 순위 */
.rank{display:flex; align-items:baseline; gap:9px;}
.rank .no{font-size:12px; font-weight:800; color:var(--accent); letter-spacing:.06em;}
.fit{font-size:13px; color:var(--ink2); font-weight:700;}

/* 잠금 영역 */
.lock{border:1px dashed var(--accent-line); background:var(--accent-soft);
  border-radius:18px; padding:22px 20px; text-align:center;}
.blur{position:relative; max-height:112px; overflow:hidden; color:var(--ink3);}
.blur:after{content:""; position:absolute; left:0; right:0; bottom:0; height:70px;
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff);}

/* 광고 자리 */
.adbox{border:1px solid var(--line2); border-radius:16px; background:#F7F3EF; padding:26px 18px; text-align:center;}
.adslot{border:1px dashed var(--line2); border-radius:12px; padding:34px 12px; color:var(--ink3); font-size:13px; background:#fff;}
.count{font-size:34px; font-weight:800; letter-spacing:-.03em; margin-top:14px;}

/* 모달 */
.mask{position:fixed; inset:0; background:rgba(43,35,32,.42); z-index:60; display:flex; align-items:flex-end;}
.sheet{width:100%; max-width:520px; margin:0 auto; background:#fff;
  border-radius:22px 22px 0 0; padding:26px 22px calc(22px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 6px; font-size:19px; font-weight:700; letter-spacing:-.02em;}

/* 목록 */
.li{display:flex; gap:10px; margin-top:11px; font-size:15px; color:var(--ink2); line-height:1.6;}
.li b{color:var(--ink); font-weight:700;}
.dot{flex:0 0 6px; width:6px; height:6px; border-radius:50%; background:var(--accent-line); margin-top:9px;}
.note{background:#FAF6F2; border-radius:14px; padding:15px 17px; font-size:14px; color:var(--ink2); line-height:1.65;}

.fade{animation:fi .3s ease both;}
@keyframes fi{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.spin{width:34px; height:34px; border-radius:50%; border:3px solid var(--accent-soft);
  border-top-color:var(--accent); animation:sp .8s linear infinite; margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.center{text-align:center;}
.hide{display:none !important;}
</style>
</head>
<body>
<div id="root"></div>
<script>

/* ============================================================
   저장소 — 회원가입 없음. 전부 이 기기 안에만 남습니다.
   ============================================================ */
var KEY = 'pickme_v2';
var DB = { profile:{}, seen:0, history:[], deepDate:'', deepUsed:0, introDone:false };

function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function loadDB(){
  try{
    var raw = window.localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && typeof o === 'object'){
        DB.profile = o.profile || {};
        DB.seen = o.seen || 0;
        DB.history = o.history || [];
        DB.deepDate = o.deepDate || '';
        DB.deepUsed = o.deepUsed || 0;
        DB.introDone = !!o.introDone;
      }
    }
  }catch(e){ /* 저장소를 못 쓰는 환경에서도 앱은 동작합니다 */ }
  if(DB.deepDate !== todayStr()){ DB.deepDate = todayStr(); DB.deepUsed = 0; }
}
function saveDB(){
  try{ window.localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
}

/* ============================================================
   DOM 헬퍼 — 백틱 없이, createElement 로만 만듭니다.
   ============================================================ */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls){ n.className = cls; }
  if(text !== undefined && text !== null){ n.textContent = String(text); }
  return n;
}
function add(parent){
  for(var i=1;i<arguments.length;i++){
    var c = arguments[i];
    if(c){ parent.appendChild(c); }
  }
  return parent;
}
function clear(n){ while(n.firstChild){ n.removeChild(n.firstChild); } }
function on(n, fn){ n.addEventListener('click', fn); return n; }
function svgIcon(d){

}

function multiline(parent, text, cls){
  var rows = String(text).split('\n');
  for(var i=0;i<rows.length;i++){
    if(i>0){ parent.appendChild(document.createElement('br')); }
    parent.appendChild(document.createTextNode(rows[i]));
  }
  if(cls){ parent.className = cls; }
  return parent;
}
function bullet(strong, rest){
  var row = el('div','li');
  add(row, el('span','dot'));

  if(strong){ var b = el('b','', strong); t.appendChild(b); t.appendChild(document.createTextNode(' ')); }

  add(row, t);

}

/* ============================================================
   엔진 1 — 카테고리 인식
   ============================================================ */
function findCategory(text){
  var t = String(text || '').replace(/\s/g,'');
  if(!t){ return null; }
  var cats = CONFIG.data.categories, i, j;
  for(i=0;i<cats.length;i++){
    var al = cats[i].aliases;
    for(j=0;j<al.length;j++){
      if(t.indexOf(al[j]) >= 0){ return cats[i]; }
    }
  }
  return null;
}
function catById(id){
  var c = CONFIG.data.categories, i;
  for(i=0;i<c.length;i++){ if(c[i].id === id){ return c[i]; } }
  return null;
}
function axisById(id){
  var a = CONFIG.axes, i;
  for(i=0;i<a.length;i++){ if(a[i].id === id){ return a[i]; } }
  return null;
}

/* ============================================================
   엔진 2 — 질문 구성
   카테고리 가중치 상위 축만 묻습니다. 이미 답한 축은 기억해서
   두 번째 카테고리부터 질문 수가 줄어듭니다.
   ============================================================ */
function rankedAxes(cat){
  var out = [], i;
  for(i=0;i<CONFIG.axes.length;i++){
    var a = CONFIG.axes[i];
    var w = cat.weights[a.id];
    if(w === undefined){ w = 0.3; }
    out.push({ axis:a, w:w });
  }
  out.sort(function(x,y){ return y.w - x.w; });
  return out;
}
function questionsFor(cat){
  var ranked = rankedAxes(cat);
  var top = ranked.slice(0, 5);
  var known = DB.profile;
  var mustAsk = [], reuse = [], i;
  for(i=0;i<top.length;i++){
    var id = top[i].axis.id;
    var isCore = (i < 2);
    if(known[id] === undefined || isCore){ mustAsk.push(top[i].axis); }
    else { reuse.push(top[i].axis); }
  }
  if(mustAsk.length < 2){
    for(i=0;i<reuse.length && mustAsk.length < 2;i++){ mustAsk.push(reuse[i]); }
  }
  return { ask:mustAsk, reuse:reuse, top:top };
}

/* ============================================================
   엔진 3 — 점수 계산
   ============================================================ */
function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }
function axisScore(mode, u, p){
  var d;
  if(mode === 'budget'){
    if(p <= u){ d = (u - p) * 0.22; return clamp01(1 - d); }
    return clamp01(1 - (p - u) * 2.2);
  }
  if(mode === 'atLeast'){
    if(p >= u){ return clamp01(1 - (p - u) * 0.14); }
    return clamp01(1 - (u - p) * 1.8);
  }
  if(mode === 'store'){ return clamp01(1 - Math.abs(u - p) * 0.85); }
  return clamp01(1 - Math.abs(u - p) * 1.3);
}
function scorePick(cat, pick, profile){
  var ranked = rankedAxes(cat), i, sum = 0, wsum = 0, parts = [];
  for(i=0;i<ranked.length;i++){
    var a = ranked[i].axis, w = ranked[i].w;
    var u = profile[a.id];
    if(u === undefined){ continue; }
    var p = pick.vals[a.id];
    if(p === undefined){ continue; }
    var s = axisScore(a.mode, u, p);
    sum += s * w; wsum += w;
    parts.push({ axis:a, w:w, s:s, u:u, p:p });
  }
  parts.sort(function(x,y){ return (y.w*y.s) - (x.w*x.s); });
  return { pick:pick, score: wsum ? (sum / wsum) : 0, parts:parts };
}
function recommend(cat, profile){
  var out = [], i;
  for(i=0;i<cat.picks.length;i++){ out.push(scorePick(cat, cat.picks[i], profile)); }
  out.sort(function(x,y){ return y.score - x.score; });
  return out;
}

/* ============================================================
   엔진 4 — 유형 라벨 · 경고 · 구매처
   ============================================================ */
function condMatch(cond, profile){
  var i;
  for(i=0;i<cond.length;i++){
    var c = cond[i], v = profile[c[0]];
    if(v === undefined){ return false; }
    if(v < c[1] || v > c[2]){ return false; }
  }
  return true;
}
function personaFor(profile){
  var i;
  for(i=0;i<CONFIG.personas.length;i++){
    if(condMatch(CONFIG.personas[i].cond, profile)){ return CONFIG.personas[i]; }
  }
  return CONFIG.personaFallback;
}
function warningsFor(profile){
  var out = [], i;
  for(i=0;i<CONFIG.warnings.length;i++){
    if(condMatch(CONFIG.warnings[i].cond, profile)){ out.push(CONFIG.warnings[i]); }
  }
  return out;
}
function storeRank(profile){
  var out = [], i;
  var uOff = profile.store === undefined ? 0.5 : profile.store;
  var uBud = profile.budget === undefined ? 0.5 : profile.budget;
  var uGen = profile.gentle === undefined ? 0.4 : profile.gentle;
  for(i=0;i<CONFIG.stores.length;i++){
    var s = CONFIG.stores[i];
    var fitOff = 1 - Math.abs(uOff - s.off) * 0.9;
    var fitPrice = (s.price <= uBud) ? 1 - (uBud - s.price) * 0.3 : 1 - (s.price - uBud) * 1.6;
    var fitTrust = uGen * s.trust + (1 - uGen) * 0.72;
    var sc = clamp01(fitOff) * 0.42 + clamp01(fitPrice) * 0.33 + clamp01(fitTrust) * 0.25;
    out.push({ store:s, score:sc });
  }
  out.sort(function(x,y){ return y.score - x.score; });
  return out;
}

/* ============================================================
   엔진 5 — 문장 생성 (기기 안에서 계산합니다)
   ============================================================ */
function axisWord(part){
  var a = part.axis;
  return part.u >= 0.66 ? a.highWord : (part.u <= 0.34 ? a.lowWord : (a.label + '은 중간을 원합니다'));
}
function tipFor(axisId, v){
  var t = CONFIG.axisTips[axisId];
  if(!t){ return ''; }
  return v >= 0.66 ? t.hi : (v <= 0.34 ? t.lo : t.mid);
}
function weightSentence(cat){
  var ranked = rankedAxes(cat);
  return cat.label + ' 은 ' + ranked[0].axis.label + ' 과 ' + ranked[1].axis.label +
    ' 이 결과를 가장 크게 좌우하는 카테고리입니다. 그래서 이 두 축의 답을 다른 축보다 무겁게 반영했습니다.';
}
function reasonLines(res){
  var good = [], watch = [], i;
  for(i=0;i<res.parts.length;i++){
    var p = res.parts[i];
    if(p.s >= 0.82 && good.length < 3){ good.push(p); }
  }
  for(i=res.parts.length-1;i>=0;i--){
    var q = res.parts[i];
    if(q.s < 0.6 && watch.length < 2){ watch.push(q); }
  }
  return { good:good, watch:watch };
}
function keywordsFor(cat, res, profile){
  var k = [], i;
  for(i=0;i<res.pick.tags.length;i++){ k.push(res.pick.tags[i]); }
  if(profile.gentle !== undefined && profile.gentle >= 0.7){ k.push('저자극'); }
  if(profile.budget !== undefined && profile.budget <= 0.3){ k.push('가성비'); }
  if(profile.ease !== undefined && profile.ease >= 0.85){ k.push('초보용'); }
  k.push(cat.label.split(' ')[0]);
  return k;
}
function checkList(cat, res, profile){
  var out = [];
  if(profile.gentle !== undefined && profile.gentle >= 0.7){
    out.push(['성분표 앞쪽 다섯 줄', '향료와 알코올이 앞쪽에 있으면 예민한 피부에는 부담이 됩니다.']);
  }
  if(profile.lasting !== undefined && profile.lasting >= 0.75){
    out.push(['지우는 방법', '지속력이 높은 제형일수록 어떻게 지우는지를 사기 전에 확인해야 합니다.']);
  }
  if(profile.store !== undefined && profile.store >= 0.6){
    out.push(['손등이 아니라 실제 부위', '손등 발색과 실제 부위 발색은 다릅니다. 가능하면 쓰는 자리에 발라봅니다.']);
  }
  if(profile.budget !== undefined && profile.budget <= 0.4){
    out.push(['용량당 가격', '싸 보여도 용량이 작으면 결국 비쌉니다. 밀리리터당 가격으로 비교합니다.']);
  }
  out.push(['제조일자', cat.label + '은 개봉 후 사용 기한이 짧은 편입니다. 제조일자 표기를 확인합니다.']);
  return out.slice(0, 4);
}

  add(s, el('div','eyebrow', CONFIG.copy.resultTitle));
  add(s, el('h1','t', per.name));
  add(s, el('p','s', per.desc));
  add(w, s);

  var pc = el('div','sec');
  var ranked = rankedAxes(STATE.cat), i;
  for(i=0;i<ranked.length;i++){
    var a = ranked[i].axis;
    if(prof[a.id] === undefined){ continue; }
    add(pc, axisBar(a, prof[a.id]));
  }
  add(w, pc);

  add(w, el('div','divider'));
  var rw = el('div','');
  add(rw, el('h3','t', '이 기준에 맞는 유형'));
  add(rw, el('p','xs', '상품명이 아니라 유형으로 알려드립니다. 같은 유형 안에서는 가격과 취향으로 고르시면 됩니다.'));
  add(w, rw);

  var lw = el('div','sec');
  for(i=0;i<Math.min(3, res.length);i++){ add(lw, pickCard(res[i], i+1, prof)); }
  add(w, lw);

  var st = storeRank(prof);
  var sw = el('div','sec');
  add(sw, el('h3','t', '어디서 사는 게 맞을까요'));
  var sc = el('div','card');
  add(sc, el('h3','t', st[0].store.name));
  add(sc, el('p','xs', st[0].store.trait));
  add(sc, bullet('이렇게 사세요', st[0].store.tip));
  add(sw, sc);
  var sc2 = el('div','card');
  add(sc2, el('h3','t', '대안 · ' + st[1].store.name));
  add(sc2, el('p','xs', st[1].store.trait));
  add(sw, sc2);
  add(w, sw);

  add(w, el('div','divider'));
  add(w, deepGate());

  var fw = el('div','sec');
  add(fw, el('h3','t', '이 추천, 어떠셨어요?'));
  add(fw, el('p','xs', '알려주시면 다음 추천이 조금 더 맞아집니다.'));
  var fr = el('div','btnrow');
  add(fr, on(el('button','btn soft sm','괜찮아요'), function(){ logHistory('good'); toastSheet('기록했습니다', '실제로 사셨는지는 다음에 앱을 열 때 여쭤볼게요.'); }));
  add(fr, on(el('button','btn ghost sm','잘 안 맞아요'), function(){ logHistory('bad'); toastSheet('기록했습니다', '다음에 같은 카테고리를 고르시면 기준을 다시 묻겠습니다.'); }));
  add(fw, fr);
  add(w, fw);

  var st2 = el('div','sticky');
  add(st2, on(el('button','btn ghost','다른 것도 골라보기'), goHome));
  add(w, st2);
}

/* ============================================================
   심층 해설 — 광고를 보면 열립니다 (수익 지점)
   ============================================================ */
function deepAvailableFree(){
  if(DB.deepDate !== todayStr()){ DB.deepDate = todayStr(); DB.deepUsed = 0; }
  return DB.deepUsed < CONFIG.revenue.freeDeepPerDay;
}
function deepGate(){
  var box = el('div','');
  add(box, el('h3','t', CONFIG.copy.deepTitle));
  add(box, el('p','xs', '왜 이 결과가 나왔는지, 어디서 실패하기 쉬운지, 매장에서 무엇을 확인해야 하는지를 항목별로 풀어드립니다.'));

  var pv = el('div','card');
  var blur = el('div','blur');
  add(blur, el('p','xs', '당신은 ' + '지속력을 높게, 자극은 낮게 요구하고 있습니다. 이 두 가지는 대체로 반대 방향이라 제품 하나로 모두 만족시키기 어렵습니다. 그래서 실제로는 다음 순서로 접근하는 편이 낫습니다. 첫째로 ...'));
  add(pv, blur);
  add(box, pv);

  var free = deepAvailableFree();
  var b = el('button','btn', free ? '심층 해설 열기 (오늘 무료 1회)' : '광고 보고 열기');
  on(b, function(){
    if(free){ DB.deepUsed++; saveDB(); STATE.screen = 'deep'; render(); }
    else { openAd(); }
  });
  var bw = el('div','sec'); add(bw, b);
  if(!free){ add(bw, el('p','xs', '오늘 무료 1회를 이미 쓰셨습니다. 짧은 광고를 보시면 이어서 열립니다.')); }
  add(box, bw);
  return box;
}

function openAd(){
  STATE.screen = 'ad';
  STATE.adLeft = CONFIG.revenue.adSeconds;
  render();
  if(STATE.adTimer){ window.clearInterval(STATE.adTimer); }
  STATE.adTimer = window.setInterval(function(){
    STATE.adLeft--;
    if(STATE.adLeft <= 0){
      window.clearInterval(STATE.adTimer); STATE.adTimer = null;
      if(STATE.screen === 'ad'){ STATE.screen = 'deep'; render(); }
      return;
    }
    if(STATE.screen === 'ad'){ render(); } else { window.clearInterval(STATE.adTimer); STATE.adTimer = null; }
  }, 1000);
}
function renderAd(){
  var w = frame('광고', { back: function(){ if(STATE.adTimer){ window.clearInterval(STATE.adTimer); STATE.adTimer=null; } STATE.screen='result'; render(); } });
  var s = el('div','sec');
  var box = el('div','adbox');
  add(box, el('div','adslot', '광고 영역'));
  add(box, el('div','count', STATE.adLeft + '초'));
  add(box, el('p','xs', CONFIG.revenue.adNote));
  add(s, box);
  add(w, s);
}

function renderDeep(){
  var prof = profileNow();
  var res = STATE.res;
  var w = frame(CONFIG.copy.deepTitle, { back:function(){ STATE.screen='result'; render(); } });

  var s = el('div','sec');
  add(s, el('div','eyebrow', STATE.cat.label));
  add(s, el('h1','t', res[0].pick.name));
  add(s, el('p','s', '아래는 전부 당신이 고른 답을 근거로 계산한 것입니다.'));
  add(w, s);

  /* 1. 기준 요약 */
  var s1 = el('div','sec');
  add(s1, el('h3','t', '1. 당신이 말한 기준'));
  add(s1, el('p','xs', weightSentence(STATE.cat)));
  var parts = res[0].parts, i;
  for(i=0;i<parts.length;i++){
    var cA = el('div','card');
    add(cA, el('h3','t', parts[i].axis.label + ' · ' + axisWord(parts[i])));
    add(cA, el('p','xs', tipFor(parts[i].axis.id, parts[i].u)));
    add(s1, cA);
  }
  add(w, s1);

  /* 2. 왜 이 유형인가 */
  var s2 = el('div','sec');
  add(s2, el('h3','t', '2. 왜 이 유형이 나왔나'));
  var rl = reasonLines(res[0]);
  for(i=0;i<rl.good.length;i++){
    add(s2, bullet(rl.good[i].axis.label + '에서 일치', '이 카테고리에서 비중이 큰 축인데 요구와 유형이 맞아떨어졌습니다.'));
  }
  add(s2, bullet('좋은 점', res[0].pick.good));
  add(s2, bullet('걸리는 점', res[0].pick.watch));
  add(w, s2);

  /* 3. 2순위와의 차이 */
  if(res.length > 1){
    var s3 = el('div','sec');
    add(s3, el('h3','t', '3. 2순위와 무엇이 다른가'));
    add(s3, el('div','note', res[1].pick.name + ' 은 ' + Math.round(res[1].score*100) + '% 일치입니다. ' + res[1].pick.good + ' 다만 ' + res[1].pick.watch));
    var diff = [], j, q, pb;
    for(j=0;j<res[0].parts.length;j++){
      pb = null;
      for(q=0;q<res[1].parts.length;q++){
        if(res[1].parts[q].axis.id === res[0].parts[j].axis.id){ pb = res[1].parts[q]; }
      }
      if(pb){ diff.push({ axis:res[0].parts[j].axis, gap: res[0].parts[j].s - pb.s }); }
    }
    diff.sort(function(x,y){ return Math.abs(y.gap) - Math.abs(x.gap); });
    if(diff.length > 0){
      add(s3, bullet('갈린 지점', diff[0].axis.label + ' 에서 두 유형이 가장 크게 갈렸습니다. ' +
        (diff[0].gap >= 0
          ? '1순위 쪽이 이 축에서 당신의 요구를 더 잘 맞춥니다.'
          : '이 축만 놓고 보면 2순위가 낫습니다. 다른 축의 비중이 더 커서 순위가 뒤집혔습니다.')));
    }
    add(s3, bullet('이렇게 보세요', '두 유형의 일치율 차이가 10%p 안쪽이면 사실상 취향 문제입니다. 그럴 때는 값이 싼 쪽을 먼저 써보고 판단하는 편이 손해가 적습니다.'));
    add(w, s3);
  }

  /* 4. 실패 지점 */
  var wr = warningsFor(prof);
  var s4 = el('div','sec');
  add(s4, el('h3','t', '4. 여기서 실패하기 쉽습니다'));
  if(wr.length === 0){
    add(s4, el('p','xs', '기준끼리 크게 충돌하는 조합은 없습니다. 유형만 맞추면 실패 확률이 낮습니다.'));
  }
  for(i=0;i<wr.length;i++){
    var c4 = el('div','card');
    add(c4, el('h3','t', wr[i].t));
    add(c4, el('p','xs', wr[i].b));
    add(s4, c4);
  }
  add(w, s4);

  /* 5. 구매처 전략 */
  var st = storeRank(prof);
  var s5 = el('div','sec');
  add(s5, el('h3','t', '5. 구매처 전략'));
  for(i=0;i<st.length;i++){
    add(s5, bullet(st[i].store.name + ' (' + Math.round(st[i].score*100) + '%)', st[i].store.trait + ' ' + (i===0 ? st[i].store.tip : '')));
  }
  add(w, s5);

  /* 6. 체크리스트 */
  var cl = checkList(STATE.cat, res[0], prof);
  var s6 = el('div','sec');
  add(s6, el('h3','t', '6. 사기 전에 확인할 것'));
  for(i=0;i<cl.length;i++){ add(s6, bullet(cl[i][0], cl[i][1])); }
  add(w, s6);

  /* 7. 검색 키워드 */
  var kw = keywordsFor(STATE.cat, res[0], prof);
  var s7 = el('div','sec');
  add(s7, el('h3','t', '7. 이 키워드로 찾으세요'));
  var chips = el('div','chips');
  for(i=0;i<kw.length;i++){ add(chips, el('span','chip', kw[i])); }
  add(s7, chips);
  add(s7, on(el('button','btn soft sm','키워드 복사'), function(){ copyText(kw.join(' ')); }));
  s7.lastChild.style.marginTop = '14px';
  add(w, s7);

  /* 8. 다음 구매 */
  var s8 = el('div','sec');
  add(s8, el('h3','t', '8. 다음에 고를 때'));
  add(s8, bullet('기준은 저장되어 있습니다', '지금 답해주신 축은 이 기기에 남습니다. 다음에 다른 카테고리를 고르시면 겹치는 축은 다시 묻지 않고 두세 개만 여쭤봅니다.'));
  add(s8, bullet('바뀌면 다시 물어야 합니다', '계절이 바뀌거나 피부 상태가 달라지면 지속력과 저자극 답이 달라집니다. 홈 화면에서 기준을 지우고 처음부터 다시 시작할 수 있습니다.'));
  add(s8, bullet('실제로 샀는지 알려주세요', '추천이 구매까지 이어졌는지가 가장 정확한 신호입니다. 다음에 앱을 열면 여쭤보겠습니다.'));
  add(w, s8);

  var stk = el('div','sticky');
  add(stk, on(el('button','btn ghost','결과로 돌아가기'), function(){ STATE.screen='result'; render(); }));
  add(w, stk);

  logHistory(null);
}

function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t);
      toastSheet('복사했습니다', t);
      return;
    }
  }catch(e){}
  toastSheet('키워드', t);
}

/* ============================================================
   기록 · 피드백
   ============================================================ */
var LOGGED = false;
function logHistory(mark){
  if(LOGGED && mark === null){ return; }
  var last = DB.history.length ? DB.history[DB.history.length-1] : null;
  if(last && last.cat === STATE.cat.label && last.pick === STATE.res[0].pick.name && !last.bought){
    if(mark){ last.mark = mark; }
    saveDB(); return;
  }
  DB.history.push({ ts: Date.now(), cat: STATE.cat.label, pick: STATE.res[0].pick.name, mark: mark || '', bought: '' });
  if(DB.history.length > 20){ DB.history.shift(); }
  LOGGED = true;
  saveDB();
}
function pendingFeedback(){
  var i;
  for(i=DB.history.length-1;i>=0;i--){
    if(!DB.history[i].bought){ return DB.history[i]; }
  }
  return null;
}
function answerFeedback(item, v){
  item.bought = v;
  saveDB();
  render();
  toastSheet('고맙습니다', v === 'bought' ? '실제 구매까지 이어졌는지가 가장 정확한 신호입니다.' : '무엇이 걸렸는지는 다음 인터뷰에서 다시 여쭤보겠습니다.');
}

/* ============================================================
   시트 · 종료 확인 모달
   ============================================================ */
function closeSheet(){
  if(SHEET && SHEET.parentNode){ SHEET.parentNode.removeChild(SHEET); }
  SHEET = null;
}
function baseSheet(){
  closeSheet();
  var mask = el('div','mask');
  var sh = el('div','sheet');
  add(mask, sh);
  mask.addEventListener('click', function(ev){ if(ev.target === mask){ closeSheet(); } });
  document.body.appendChild(mask);
  SHEET = mask;
  return sh;
}
function toastSheet(title, body){
  var sh = baseSheet();
  add(sh, el('h3','', title));
  add(sh, el('p','xs', body));
  var r = el('div','btnrow');
  add(r, on(el('button','btn','확인'), closeSheet));
  add(sh, r);
}
function alertSheet(title, body){ toastSheet(title, body); }
function openExit(){
  var sh = baseSheet();
  add(sh, el('h3','', CONFIG.appName + ' 을 종료할까요?'));
  add(sh, el('p','xs', '지금까지 답해주신 기준은 이 기기에 저장되어 있어 다음에 다시 열면 그대로 이어집니다.'));
  var r = el('div','btnrow');
  add(r, on(el('button','btn ghost','계속 쓰기'), closeSheet));
  add(r, on(el('button','btn','종료'), function(){
    closeSheet();
    try{
      if(window.TossAppBridge && window.TossAppBridge.close){ window.TossAppBridge.close(); return; }
      if(window.AppsInToss && window.AppsInToss.close){ window.AppsInToss.close(); return; }
    }catch(e){}
    try{ window.close(); }catch(e2){}
    toastSheet('종료할 수 없습니다', '이 환경에서는 앱을 직접 닫을 수 없습니다. 토스 앱 안에서는 정상적으로 종료됩니다.');
  }));
  add(sh, r);
}

/* ============================================================
   렌더 · 내비게이션
   ============================================================ */
function render(){
  if(STATE.screen === 'intro'){ renderIntro(); }
  else if(STATE.screen === 'interview'){ renderInterview(); }
  else if(STATE.screen === 'analyzing'){ renderAnalyzing(); }
  else if(STATE.screen === 'result'){ renderResult(); }
  else if(STATE.screen === 'deep'){ renderDeep(); }
  else if(STATE.screen === 'ad'){ renderAd(); }
  else { renderHome(); }
  window.scrollTo(0, 0);
}
function pushGuard(){
  try{ window.history.pushState({ pickme:1 }, ''); }catch(e){}
}
window.addEventListener('popstate', function(){
  pushGuard();
  if(SHEET){ closeSheet(); return; }
  if(STATE.screen === 'home' || STATE.screen === 'intro'){ openExit(); return; }
  back();
});

/* ============================================================
   부팅
   ============================================================ */
function boot(){
  loadDB();
  if(CONFIG.expiresAt){
    var now = new Date();
    var ex = new Date(CONFIG.expiresAt);
    if(now > ex){
      clear(ROOT);
      var w = el('div','wrap');
      var c = el('div','card');
      add(c, el('h2','t','안내가 끝난 서비스입니다'));
      add(c, el('p','xs', CONFIG.expiresAt + ' 이후로는 내용이 갱신되지 않습니다.'));
      add(w, c); add(ROOT, w);
      return;
    }
  }
  STATE.screen = DB.introDone ? 'home' : 'intro';
  pushGuard();
  render();
}
boot();

})();
</script>
