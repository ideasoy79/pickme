<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FDFBFA">
<title>픽미닷 — 광고 없이 나한테 맞는 화장품 추천</title>
<meta name="description" content="클렌징 뭐 쓰지, 세럼 뭐 발라야 하지 — 광고 없이 조건 몇 개만 고르면 실제 브랜드와 제품명, 성분 근거를 바로 보여드립니다. 후기가 광고인지도 확인해 드려요.">
<meta property="og:title" content="픽미닷 — 광고 없이 나한테 맞는 화장품 추천">
<meta property="og:description" content="조건 몇 개만 고르면 실제 제품과 성분 근거를 바로 보여드립니다. 광고 없이, 나한테 맞는 것만.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
:root{
  --bg:#FDFBFA; --card:#FFFFFF; --ink:#1A1519; --sub:#5B535A; --dim:#918A93;
  --line:#EBE4E6; --line-s:#F4EFF0;
  --accent:#C2415F; --accent-deep:#9C2E48; --soft:#FCEEF1; --soft-d:#F7DDE3;
  --gold:#A8813F; --gold-soft:#F7F0E2;
  --good:#1B8A5A; --good-soft:#E6F4EC;
  --warn:#BE3A34; --warn-soft:#FBECEB;
  --ink-deep:#150F13;
  --r:16px; --r-s:11px; --r-l:22px; --r-xl:28px;
  --sh-s:0 1px 2px rgba(21,15,19,0.05), 0 1px 1px rgba(21,15,19,0.03);
  --sh:0 6px 20px rgba(21,15,19,0.07), 0 1px 3px rgba(21,15,19,0.05);
  --sh-l:0 16px 40px rgba(21,15,19,0.12), 0 3px 8px rgba(21,15,19,0.06);
  --sh-accent:0 10px 26px rgba(194,65,95,0.22), 0 2px 6px rgba(194,65,95,0.14);
  /* 숫자·영문 신호 요소용 : 새 한글 폰트를 통째로 얹지 않고, 이미 쓰고 있는
     시스템 모노스페이스를 재사용한다. 로딩 비용이 없고, 한글 글자는
     이 폰트에 없으므로 자동으로 Pretendard 로 폴백된다. */
  --font-num:ui-monospace,SFMono-Regular,Menlo,Consolas,"Pretendard Variable",-apple-system,sans-serif;
}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.62; letter-spacing:-0.011em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{ font-family:inherit; font-size:inherit; color:inherit; border:0; background:none; cursor:pointer; }
input,textarea,select{ font-family:inherit; font-size:16px; color:inherit; }
#app{ max-width:520px; margin:0 auto; min-height:100vh; }

/* ---------- 내비 ---------- */
.nav{ position:sticky; top:0; z-index:40; height:56px; display:flex; align-items:center;
  background:var(--bg);
  border-bottom:1px solid var(--line); padding:0 6px; }
.nav-b{ min-width:52px; height:44px; display:flex; align-items:center; justify-content:center;
  font-size:14px; color:var(--sub); border-radius:10px; }
.nav-b:active{ background:var(--line-s); }
.nav-t{ flex:1; text-align:center; font-size:16px; font-weight:700; letter-spacing:-0.02em; }
.wrap{ padding:18px 18px 108px; }
.wrap-f{ padding:0 0 108px; }

/* ---------- 인트로 : 이미지 대신 색면 ---------- */
.hero{ position:relative; padding:46px 22px 34px; overflow:hidden; background:var(--bg); }
.hero-rule{ width:34px; height:3px; background:var(--accent); margin-bottom:18px; }
.hero-mark{ font-family:var(--font-num); font-size:11px; font-weight:800; letter-spacing:0.22em; color:var(--accent); margin-bottom:20px; }
.hero-t{ font-size:39px; line-height:1.16; font-weight:800; letter-spacing:-0.045em; margin:0 0 16px; }
.hero-t em{ font-style:normal; color:var(--accent); }
.hero-s{ font-size:16px; color:var(--sub); line-height:1.6; margin:0; max-width:19em; }

/* 키워드 3개 */
.keys{ display:flex; gap:8px; padding:22px 22px 4px; flex-wrap:wrap; }
.key{ display:flex; align-items:center; gap:7px; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r-s); padding:9px 15px 9px 11px;
  font-size:13.5px; font-weight:600; letter-spacing:-0.02em; }
.key i{ width:9px; height:9px; border-radius:50%; display:block; }
.k1 i{ background:var(--accent); } .k2 i{ background:var(--gold); } .k3 i{ background:var(--good); }

/* ---------- 공통 ---------- */
.sec{ font-size:12px; font-weight:800; letter-spacing:0.1em; color:var(--dim);
  margin:26px 0 11px; }
.sec:first-child{ margin-top:4px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--sh-s); }
.card-p{ padding:18px; }
.card-a{ background:var(--soft); border-color:var(--soft-d); }
.card-d{ background:var(--ink-deep); border-color:var(--ink-deep); color:#FFF; }
.card-w{ background:var(--warn-soft); border-color:#F1D6D4; }
.card-g{ background:var(--good-soft); border-color:#CFE8DB; }
.mb8{ margin-bottom:8px; } .mb10{ margin-bottom:10px; } .mb14{ margin-bottom:14px; }
.mb16{ margin-bottom:16px; } .mb22{ margin-bottom:22px; }
.mt10{ margin-top:10px; } .mt14{ margin-top:14px; } .mt20{ margin-top:20px; }
.tx{ font-size:15px; line-height:1.66; }
.tx-s{ font-size:14px; line-height:1.66; color:var(--sub); }
.tx-d{ font-size:13.5px; line-height:1.6; color:var(--dim); }
.tx-b{ font-size:16.5px; font-weight:750; letter-spacing:-0.028em; }
.hint{ font-size:12.5px; line-height:1.6; color:var(--dim); margin:10px 2px 0; }

/* ---------- 버튼 ---------- */
.btn{ width:100%; height:53px; border-radius:var(--r); background:var(--accent); color:#FFF;
  font-size:16px; font-weight:750; letter-spacing:-0.024em; display:flex;
  align-items:center; justify-content:center; margin-top:12px; transition:transform .08s;
  box-shadow:var(--sh-accent); }
.btn:active{ transform:scale(0.975); }
.btn-o{ background:var(--card); color:var(--ink); border:1.5px solid var(--line); box-shadow:none; }
.btn-d{ background:var(--ink-deep); box-shadow:var(--sh); }
.btn-s{ height:44px; font-size:14.5px; }
.shop-row{ display:flex; gap:8px; }
.shop-row .btn{ width:auto; flex:1; margin-top:0; font-size:14.5px; }

/* ---------- 카테고리 타일 ---------- */
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile{ position:relative; border-radius:var(--r-l); padding:18px 15px 17px; text-align:left;
  border:1px solid var(--line); background:var(--card); overflow:hidden; transition:transform .08s;
  box-shadow:var(--sh-s); }
.tile:active{ transform:scale(0.97); }
.tile-d{ width:38px; height:38px; border-radius:11px; margin-bottom:30px;
  display:flex; align-items:center; justify-content:center; color:#FFF; }
.tile-d svg{ opacity:0.92; }
.tile-t{ font-size:16.5px; font-weight:780; letter-spacing:-0.03em; }
.tile-s{ font-size:12.5px; color:var(--dim); margin-top:2px; }
.tile-n{ position:absolute; right:14px; top:16px; font-size:11.5px; font-weight:700; color:var(--dim); }

/* ---------- 칩 ---------- */
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1.5px solid var(--line); background:var(--card); border-radius:100px;
  padding:10px 15px; font-size:14.5px; font-weight:600; letter-spacing:-0.022em;
  color:var(--sub); transition:transform .08s; }
.chip:active{ transform:scale(0.96); }
.chip.on{ background:var(--ink-deep); border-color:var(--ink-deep); color:#FFF; }
.chip-a.on{ background:var(--accent); border-color:var(--accent); }
.chip-w.on{ background:var(--warn); border-color:var(--warn); }

/* ---------- 진행 ---------- */
.steps{ display:flex; gap:5px; padding:0 18px 14px; }
.steps > i{ flex:1; height:3px; border-radius:2px; background:var(--line); display:block; }
.steps > i.on{ background:var(--accent); }

/* ---------- 제품 카드 ---------- */
.prod{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-l);
  padding:0; overflow:hidden; margin-bottom:12px; text-align:left; width:100%; display:block;
  box-shadow:var(--sh); }
.prod-h{ display:flex; align-items:flex-start; gap:13px; padding:16px 16px 13px; }
.prod-sw{ width:50px; height:50px; border-radius:14px; flex:0 0 auto; }
.prod-i{ flex:1; min-width:0; }
.prod-br{ font-size:12px; font-weight:750; color:var(--accent); letter-spacing:0.01em; }
.prod-nm{ font-size:16.5px; font-weight:780; letter-spacing:-0.032em; line-height:1.3; margin-top:2px; }
.prod-pr{ font-family:var(--font-num); font-size:13px; color:var(--dim); margin-top:4px; }
.prod-rk{ flex:0 0 auto; text-align:right; }
.prod-rk b{ display:block; font-size:23px; font-weight:800; letter-spacing:-0.04em; line-height:1; }
.prod-rk span{ display:block; font-size:10.5px; color:var(--dim); margin-top:3px; }
.prod-why{ background:var(--soft); padding:13px 16px; font-size:14px; line-height:1.6;
  border-top:1px solid var(--soft-d); }
.prod-why b{ font-weight:750; }
.prod-b{ padding:13px 16px 15px; }
.ings{ display:flex; flex-wrap:wrap; gap:5px; }
.ing{ font-size:11.5px; font-weight:650; padding:4px 9px; border-radius:6px;
  background:var(--line-s); color:var(--sub); }
.ing.hit{ background:var(--good-soft); color:#12704A; }
.ing.avoid{ background:var(--warn-soft); color:#9E2A25; }
.watch{ font-size:13px; color:var(--warn); margin-top:9px; line-height:1.55; }
.fnc{ display:inline-block; font-size:11px; font-weight:750; padding:3px 8px;
  border-radius:5px; background:var(--gold-soft); color:#7D5E22; margin-top:9px; }
.rank1{ border:1.5px solid var(--accent); }
.badge1{ background:var(--accent); color:#FFF; font-size:11px; font-weight:800;
  letter-spacing:0.06em; padding:5px 16px; }

/* ---------- 비교표 ---------- */
.cmp{ width:100%; border-collapse:collapse; font-size:13px; }
.cmp th,.cmp td{ border-bottom:1px solid var(--line-s); padding:9px 6px; text-align:left;
  vertical-align:top; }
.cmp th{ font-size:11.5px; color:var(--dim); font-weight:700; }
.cmp td:first-child{ color:var(--dim); font-size:12px; width:74px; }

/* ---------- 프롬프트 ---------- */
.pbox{ background:var(--ink-deep); color:#E9E3E6; border-radius:var(--r);
  padding:15px; font-size:12.5px; line-height:1.72; white-space:pre-wrap;
  word-break:break-all; max-height:280px; overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

/* ---------- 체크리스트 ---------- */
.ck{ display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
  padding:14px 15px; border:1px solid var(--line); border-radius:var(--r-s);
  background:var(--card); margin-bottom:8px; }
.ck-x{ width:24px; height:24px; border-radius:8px; border:1.5px solid var(--line);
  flex:0 0 auto; margin-top:1px; display:flex; align-items:center; justify-content:center;
  color:transparent; }
.ck-x svg{ width:14px; height:14px; stroke-width:3; }
.ck.on .ck-x{ background:var(--good); border-color:var(--good); color:#FFF; }
.ck-t{ font-size:14.5px; font-weight:650; line-height:1.45; }
.ck-h{ font-size:12.5px; color:var(--dim); margin-top:3px; line-height:1.5; }

/* ---------- 목록 ---------- */
.item{ display:block; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r-s); padding:14px 15px; margin-bottom:8px; }
.item-t{ font-size:15px; font-weight:680; letter-spacing:-0.025em; line-height:1.45; }
.item-m{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; font-size:12px; color:var(--dim); }
.tag{ font-size:11.5px; font-weight:650; padding:3px 8px; border-radius:5px;
  background:var(--line-s); color:var(--sub); }
.tag-a{ background:var(--soft); color:var(--accent-deep); }

/* ---------- 하단 탭 ---------- */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:38; display:flex;
  background:var(--bg); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); }
.tabbar-in{ max-width:520px; margin:0 auto; display:flex; width:100%; }
.tb{ flex:1; height:56px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:var(--dim); }
.tb.on{ color:var(--accent); }
.tb-i{ width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.tb-i svg{ width:21px; height:21px; }
.tb.on .tb-i svg{ stroke-width:2.2; }
.tb-l{ font-size:10.5px; font-weight:700; letter-spacing:-0.02em; }

/* ---------- 모달 ---------- */
.mask{ position:fixed; inset:0; z-index:60; background:rgba(21,15,19,0.42);
  display:flex; align-items:flex-end; }
.sheet{ width:100%; max-width:520px; margin:0 auto; background:var(--card);
  border-radius:var(--r-xl) var(--r-xl) 0 0; padding:24px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--sh-l); }
.sheet-t{ font-size:19px; font-weight:800; letter-spacing:-0.035em; margin-bottom:9px; }

.toast{ position:fixed; left:50%; bottom:78px; transform:translateX(-50%); z-index:70;
  background:var(--ink-deep); color:#FFF; font-size:14px; font-weight:600;
  padding:12px 20px; border-radius:100px; max-width:88%; text-align:center; }

.foot{ margin-top:30px; padding-top:16px; border-top:1px solid var(--line-s);
  font-size:11.5px; line-height:1.65; color:var(--dim); }
.mtr{ height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.mtr > i{ display:block; height:100%; background:var(--accent); border-radius:3px; }

/* ---- 확장 : 화면 조립용 ---- */
.sec{ font-size:inherit; font-weight:inherit; letter-spacing:normal; color:var(--ink);
  padding:0 20px; margin:0 0 26px; text-transform:none; }
.sec:first-child{ margin-top:0; }
.sec-t{ font-size:20px; font-weight:800; letter-spacing:-0.035em; margin:0 0 6px; }
.sec-s{ font-size:13.5px; color:var(--dim); line-height:1.6; margin:0; }
.pg-t{ font-size:26px; font-weight:800; letter-spacing:-0.042em; line-height:1.25; margin:2px 0 8px; }
.pg-s{ font-size:14px; color:var(--sub); line-height:1.62; margin:0 0 14px; }
.num{ display:inline-block; width:20px; height:20px; line-height:20px; text-align:center;
  border-radius:6px; background:var(--accent); color:#FFF; font-size:11.5px; font-weight:800;
  margin-right:8px; vertical-align:1px; }
.hero-in{ position:relative; z-index:2; }
.hero-line{ display:block; }
.hero-em{ font-style:normal; color:var(--accent); }
.cond{ display:block; width:100%; text-align:left; background:var(--soft); border:1px solid var(--soft-d);
  border-radius:var(--r); padding:13px 15px; margin-top:4px; font-family:inherit; cursor:pointer; }
.cond:active{ transform:scale(0.99); }
.cond-t{ font-size:13.5px; font-weight:700; letter-spacing:-0.02em; color:var(--ink); line-height:1.5; }
.cond-s{ font-size:12px; color:var(--accent-deep); margin-top:5px; }
.cond-e{ font-size:11.5px; color:var(--dim); margin-top:7px; text-decoration:underline; }
.chip{ display:block; text-align:left; }
.chip-l{ display:block; font-size:13.5px; font-weight:700; letter-spacing:-0.02em; }
.chip-h{ display:block; font-size:11px; opacity:0.62; margin-top:2px; font-weight:500; }
.prod-rk{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:0 16px 7px; text-align:left; }
.prod-rk-n{ font-family:var(--font-num); font-size:12px; font-weight:800; letter-spacing:0.02em; color:var(--accent); }
.prod-rk-s{ font-family:var(--font-num); font-size:11.5px; color:var(--dim); }
.prod .mtr{ margin:0 16px 14px; }
.prod-why{ margin:0 0 13px; }
.prod-why-t{ font-size:11.5px; font-weight:800; letter-spacing:0.08em; color:var(--accent-deep); margin-bottom:8px; }
.why-r{ display:flex; gap:8px; align-items:flex-start; margin-top:7px; }
.why-r:first-of-type{ margin-top:0; }
.why-d{ flex:0 0 auto; width:5px; height:5px; border-radius:3px; background:var(--accent); margin-top:8px; }
.why-r .tx-s{ margin:0; color:var(--ink); }
.ings{ display:flex; flex-wrap:wrap; gap:6px; padding:0 16px; }
.ing-r{ background:var(--line-s); color:var(--sub); border-color:var(--line); }
.watch{ margin:14px 16px 0; background:var(--warn-soft); border:1px solid #F1D6D4;
  border-radius:var(--r-s); padding:12px 14px; color:var(--ink); }
.watch-t{ font-size:11.5px; font-weight:800; letter-spacing:0.06em; color:var(--warn); margin-bottom:7px; }
.watch .tx-s{ margin:0; color:var(--ink); }
.fnc{ display:inline-block; margin:0 16px 12px; font-size:11.5px; font-weight:750;
  color:var(--gold); background:var(--gold-soft); border-radius:6px; padding:5px 10px; }
.prod .hint{ padding:0 16px 16px; margin-top:12px; }
.prod .tx-s{ padding:0 16px; }
.prod .ings + .tx-s{ margin-top:13px; }
.badge1{ display:block; background:var(--ink-deep); color:#FFF; font-size:11px; font-weight:750;
  letter-spacing:0.05em; padding:8px 16px; }
.rank1{ border-color:var(--ink-deep); box-shadow:var(--sh-l); }
/* 칸마다 꼭 보는 값을 줄지어 보여 주는 자리 */
.spec{ display:flex; flex-wrap:wrap; gap:8px; margin:0 16px 2px; }
.spec-c{ flex:1 1 92px; min-width:92px; background:var(--bg-soft,#F6F4F1);
  border:1px solid var(--line-s); border-radius:10px; padding:8px 10px; }
.spec-k{ font-size:10.5px; font-weight:750; letter-spacing:0.04em;
  color:var(--ink-soft,#7A736C); margin-bottom:3px; }
.spec-v{ font-size:14px; font-weight:800; color:var(--ink); letter-spacing:-0.01em; }
/* 국가 자료만 있는 제품 카드. 확인분과 눈으로 구분되게 둡니다. */
.prod-lst{ border-style:dashed; }
.badge-lst{ display:block; background:var(--bg-soft,#F6F4F1); color:var(--ink-soft,#7A736C);
  font-size:11px; font-weight:750; letter-spacing:0.05em; padding:8px 16px;
  border-bottom:1px solid var(--line-s); }
.prod-lst .btn{ margin-left:16px; margin-right:16px; width:calc(100% - 32px); }
.prod .btn{ margin-left:16px; margin-right:16px; width:calc(100% - 32px);
  display:block; text-align:center; text-decoration:none; box-sizing:border-box; }
.prod .card-w{ margin-left:16px; margin-right:16px; }
/* 아직 열 칸이 없는 대분류 */
.tile-off{ opacity:0.5; }
.item-m{ display:block; }
.item-x{ opacity:0.62; }
.cmp{ display:block; border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:var(--card); }
.cmp-r{ display:flex; border-bottom:1px solid var(--line-s); }
.cmp-r:last-child{ border-bottom:0; }
.cmp-l{ flex:0 0 68px; padding:10px 8px; font-size:11px; color:var(--dim); font-weight:700;
  background:var(--bg); border-right:1px solid var(--line-s); line-height:1.4; }
.cmp-c{ flex:1 1 0; min-width:0; padding:10px 8px; font-size:11.5px; line-height:1.5;
  border-right:1px solid var(--line-s); word-break:keep-all; }
.cmp-c:last-child{ border-right:0; }
.cmp-on{ background:var(--soft); font-weight:700; }
.cmp-h .cmp-c{ background:var(--bg); padding:11px 8px; }
.cmp-br{ font-size:10.5px; font-weight:750; color:var(--accent); }
.cmp-nm{ font-size:12px; font-weight:750; letter-spacing:-0.02em; line-height:1.35; margin-top:2px; }
.btn-off{ opacity:0.35; }

function icon(name, size){
  // 진짜 브라우저는 createElementNS 를 갖고 있으니 정식 SVG 를 만든다.
  // tools/self_check.js 처럼 document 를 아주 작게 흉내만 낸 곳에는
  // createElementNS 가 없어서, 있으면 쓰고 없으면 자리만 채운다.
  // (실제 화면에는 전혀 영향이 없다 — 브라우저에서는 항상 위쪽 분기다.)
  if (typeof document.createElementNS === 'function'){
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('width', size || 20);
    svg.setAttribute('height', size || 20);
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','1.6');
    svg.setAttribute('stroke-linecap','square');
    svg.setAttribute('stroke-linejoin','miter');
    svg.innerHTML = ICONS[name] || '';
    return svg;
  }
  var ph = document.createElement('span');
  ph.setAttribute('data-icon', name || '');
  return ph;
}

/* 데이터를 갈아끼우는 지점. 내장 스냅샷이든 내려받은 파일이든 여기를 통과한다. */
CONFIG.applyData = function(list, version){
  var keep = [], i, p;
  for(i=0;i<CONFIG.products.length;i++){
    if(!CONFIG.products[i].v){ keep.push(CONFIG.products[i]); }
  }
  CONFIG.products = keep.concat(list);
  var m = {}, sm = {};
  for(i=0;i<CONFIG.products.length;i++){
    p = CONFIG.products[i];
    m[p.cat] = (m[p.cat]||0) + 1;
    if(p.seg){ sm[p.seg] = (sm[p.seg]||0) + 1; }
  }
  CONFIG.catCount = m;
  CONFIG.segCount = sm;
  if(version){ CONFIG.dataVersion = version; }
};

/* 세부 칸 목록을 데이터에서 받습니다.
   어느 칸을 열지는 앱이 마음대로 정하지 않고 데이터가 정합니다. */
CONFIG.applyCells = function(cells){
  CONFIG.cells = cells || [];
};
/* 이 대분류에 속한 칸만 골라 줍니다. */
CONFIG.cellsOf = function(catId){
  var out = [];
  for(var i=0;i<CONFIG.cells.length;i++){
    if(CONFIG.cells[i].grp === catId){ out.push(CONFIG.cells[i]); }
  }
  return out;
};
CONFIG.cellById = function(key){
  for(var i=0;i<CONFIG.cells.length;i++){
    if(CONFIG.cells[i].key === key){ return CONFIG.cells[i]; }
  }
  return null;
};
/* 판매처 검색 링크를 그때그때 만듭니다.
   특정 판매 페이지 주소를 넣어 두면 품절될 때 죽고,
   죽은 링크는 앱을 못 믿게 만듭니다. */
CONFIG.shopLink = function(p){
  var q = ((p.brand || '') + ' ' + (p.name || '')).replace(/^\s+|\s+$/g, '');
  return 'https://search.shopping.naver.com/search/all?query=' + encodeURIComponent(q);
};
/* 쿠팡도 같은 이유로 검색 링크만 만듭니다. 특정 상품 URL은 품절·페이지 개편에 죽습니다. */
CONFIG.shopLinkCoupang = function(p){
  var q = ((p.brand || '') + ' ' + (p.name || '')).replace(/^\s+|\s+$/g, '');
  return 'https://www.coupang.com/np/search?q=' + encodeURIComponent(q);
};
CONFIG.applyData(CONFIG.verified, null);

/* 이 구획에서 순위를 매겨도 되는가. 후보가 적으면 순위 대신 전량 비교표로 간다. */
CONFIG.canRank = function(n){ return n >= CONFIG.minPool; };


/* ============ 기본 도구 ============ */
var R = document.getElementById('app');

function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls){ n.className = cls; }
  if(txt !== undefined && txt !== null){
    if(txt.nodeType){ n.appendChild(txt); }
    else { n.textContent = String(txt); }
  }
  return n;
}
function add(parent){
  for(var i=1;i<arguments.length;i++){
    var c = arguments[i];
    if(c){ parent.appendChild(c); }
  }
  return parent;
}
function on(node, ev, fn){ node.addEventListener(ev, fn); return node; }
function clear(node){ while(node.firstChild){ node.removeChild(node.firstChild); } }
function byId(list, id){
  for(var i=0;i<list.length;i++){ if(list[i].id === id){ return list[i]; } }
  return null;
}
function labelOf(list, id){ var o = byId(list, id); return o ? (o.label || o.n || id) : id; }
function labelsOf(list, ids){
  var out = [];
  for(var i=0;i<ids.length;i++){ out.push(labelOf(list, ids[i])); }
  return out;
}
function has(arr, v){ return arr.indexOf(v) >= 0; }
function toggle(arr, v){
  var i = arr.indexOf(v);
  if(i >= 0){ arr.splice(i,1); } else { arr.push(v); }
  return arr;
}
function won(n){
  var s = String(Math.round(n));
  var out = '';
  var c = 0;
  for(var i=s.length-1;i>=0;i--){
    out = s.charAt(i) + out;
    c++;
    if(c % 3 === 0 && i > 0){ out = ',' + out; }
  }
  return out;
}
function priceText(p){
  if(p.price[0] === p.price[1]){ return won(p.price[0]) + '원'; }
  return won(p.price[0]) + ' ~ ' + won(p.price[1]) + '원';
}
function uid(){ return 'x' + Date.now().toString(36) + Math.floor(Math.random()*9999).toString(36); }
function nowTs(){ return Date.now(); }
function dateStr(ts){
  var d = new Date(ts);
  return d.getFullYear() + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + ('0'+d.getDate()).slice(-2);
}

/* ============ 저장 ============ */
var LSKEY = 'pickme_v3';
var DB = { saved:[], notes:[], seen:false, aiSeen:false };
function loadDB(){
  try{
    var raw = window.localStorage.getItem(LSKEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && typeof o === 'object'){
        DB.saved  = o.saved || [];
        DB.notes  = o.notes || [];
        DB.seen   = !!o.seen;
        DB.aiSeen = !!o.aiSeen;
      }
    }
  }catch(e){ }
}
function saveDB(){
  try{ window.localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){ }
}

/* ============ 화면 상태 ============ */
var S = {
  view:'intro',
  cat:null, cell:null, seg:null, skin:null, care:[], avoid:[], budget:null,
  step:0,
  result:null,
  focus:null,
  checkOn:{},
  focusCare:null,
  histIdx:null
};

function resetPick(){
  S.cat = null; S.cell = null; S.seg = null; S.skin = null; S.care = []; S.avoid = []; S.budget = null;
  S.step = 0; S.result = null; S.focus = null; S.listedMore = false;
}

/* ============ 매칭 엔진 ============ */
/* 원칙 : 조건을 만족하지 않으면 걸러내고, 만족하는 것들 사이에서만 점수로 줄을 세웁니다.
   점수는 화면에 그대로 보여주고, 왜 그 점수인지 문장으로 풀어 씁니다. */

function ingHitsFor(p, careIds){
  var out = [];
  if(!p.ings){ return out; } /* 확인분이어야 할 자리에 전성분 없는 데이터가 섞여 들어와도 앱이 죽지 않게 막는다 */
  for(var i=0;i<p.ings.length;i++){
    var ing = byId(CONFIG.ings, p.ings[i]);
    if(!ing){ continue; }
    var matched = [];
    for(var j=0;j<careIds.length;j++){
      if(has(ing['for'], careIds[j])){ matched.push(careIds[j]); }
    }
    out.push({ ing:ing, matched:matched });
  }
  return out;
}

function scoreProduct(p, st){
  var reasons = [];
  var sc = 0;

  if(st.skin && has(p.skins, st.skin)){
    sc += 3;
    reasons.push({ k:'skin', w:3, t:labelOf(CONFIG.skins, st.skin) + ' 피부를 사용 대상으로 표기한 제품입니다.' });
  }

  var careHit = [];
  for(var i=0;i<st.care.length;i++){
    if(has(p.care, st.care[i])){ careHit.push(st.care[i]); }
  }
  if(careHit.length){
    sc += careHit.length * 4;
    reasons.push({ k:'care', w:careHit.length*4,
      t:'고른 고민 ' + st.care.length + '개 가운데 ' + careHit.length + '개(' + labelsOf(CONFIG.concerns, careHit).join(', ') + ')를 이 제품이 직접 겨냥합니다.' });
  }

  var hits = ingHitsFor(p, st.care);
  var hitNames = [];
  for(var h=0;h<hits.length;h++){
    if(hits[h].matched.length){
      sc += 2;
      hitNames.push(hits[h].ing.n);
    }
  }
  if(hitNames.length){
    reasons.push({ k:'ing', w:hitNames.length*2,
      t:'고민에 대응하는 성분이 전성분에 ' + hitNames.length + '개 있습니다 : ' + hitNames.join(', ') });
  }

  if(p.fnc){
    var fw = 0;
    if(p.fnc === '미백' && has(st.care,'tone')){ fw = 3; }
    else if(p.fnc === '주름개선' && has(st.care,'aging')){ fw = 3; }
    else if(p.fnc === '자외선차단'){ fw = 2; }
    else { fw = 1; }
    sc += fw;
    reasons.push({ k:'fnc', w:fw, t:'식약처 ' + p.fnc + ' 기능성으로 심사 또는 보고된 제품입니다. 표기 근거가 있는 쪽입니다.' });
  }

  if(st.budget){
    var b = byId(CONFIG.budgets, st.budget);
    if(b && p.price[1] <= b.max){
      sc += 2;
      reasons.push({ k:'price', w:2, t:'최고가까지도 예산 안에 들어옵니다. 어디서 사든 예산을 넘지 않습니다.' });
    } else if(b && p.price[0] <= b.max){
      sc += 1;
      reasons.push({ k:'price', w:1, t:'가장 싼 판매처 기준으로는 예산 안입니다. 판매처에 따라 예산을 넘을 수 있습니다.' });
    }
  }

  var cleanHit = [];
  for(var ci=0;ci<st.avoid.length;ci++){
    if(has(p.clean || [], st.avoid[ci])){ cleanHit.push(labelOf(CONFIG.avoids, st.avoid[ci])); }
  }
  if(cleanHit.length){
    sc += cleanHit.length * 2;
    reasons.push({ k:'clean', w:cleanHit.length*2,
      t:'피하고 싶다고 하신 ' + cleanHit.join(', ') + '을(를) 무첨가로 표기한 제품입니다.' });
  }

  if(p.uv === 'mineral' && has(st.avoid,'chem')){
    sc += 3;
    reasons.push({ k:'uv', w:3, t:'무기 자외선 차단 성분만 쓴 제품이라 유기자차를 피하는 조건에 정확히 맞습니다.' });
  }

  return { p:p, score:sc, reasons:reasons, hits:hits, careHit:careHit };
}

/* 이 카테고리가 제형으로 나뉘는가. 나뉜다면 서로 대체재인 것끼리만 한 표에 올린다. */
function segsOf(catId){
  var out = [];
  for(var i=0;i<(CONFIG.segs||[]).length;i++){
    if(CONFIG.segs[i].cat === catId){
      var s = CONFIG.segs[i];
      out.push({ id:s.key, label:s.label, n:(CONFIG.segCount||{})[s.key] || 0 });
    }
  }
  return out;
}
function hasSegs(catId){ return segsOf(catId).length > 1; }

function runMatch(st){
  var pool = [];
  var dropped = [];
  var i, p;

  for(i=0;i<CONFIG.products.length;i++){
    p = CONFIG.products[i];
    /* 점수와 순위는 전성분·가격까지 사람이 확인한 것에만 매긴다.
       국가 자료만 있는 것(목록분)은 점수를 낼 재료가 없으므로 여기 끼지 않는다.
       모르는 것을 아는 척하지 않기 위해서다. */
    if(p.tier === 'listed'){ continue; }
    /* 세부 칸으로 좁힌다. 클렌징 오일과 클렌징 폼은 대체재가 아니므로
       같은 순위표에 올리지 않는다. */
    if(st.cell){
      if(p.cell !== st.cell){ continue; }
    } else {
      if(st.cat && p.cat !== st.cat){ continue; }
      if(st.seg && p.seg && p.seg !== st.seg){ continue; }
    }

    var cut = null;
    for(var a=0;a<st.avoid.length;a++){
      if(has(p.avoid, st.avoid[a])){
        cut = labelOf(CONFIG.avoids, st.avoid[a]) + ' 때문에 제외';
        break;
      }
    }
    if(!cut && st.budget){
      var b = byId(CONFIG.budgets, st.budget);
      if(b && p.price[0] > b.max){ cut = '가장 싼 판매처도 예산을 넘어 제외'; }
    }
    if(cut){ dropped.push({ p:p, why:cut }); continue; }
    pool.push(scoreProduct(p, st));
  }

  pool.sort(function(x,y){
    if(y.score !== x.score){ return y.score - x.score; }
    return x.p.price[0] - y.p.price[0];
  });

  /* 후보가 얇으면 순위를 매기지 않는다.
     다섯 개 가운데 셋을 골라 1 2 3위라고 부르는 것은 고른 것이 아니라 남은 것입니다. */
  var segTotal = 0;
  for(var t=0;t<CONFIG.products.length;t++){
    var q = CONFIG.products[t];
    if(q.tier === 'listed'){ continue; }
    if(st.cell){
      if(q.cell !== st.cell){ continue; }
    } else {
      if(st.cat && q.cat !== st.cat){ continue; }
      if(st.seg && q.seg && q.seg !== st.seg){ continue; }
    }
    segTotal++;
  }
  var ranked = (typeof CONFIG.canRank === 'function')
             ? CONFIG.canRank(segTotal) : true;

  /* 가격대를 갈라 각각에서 뽑는다.
     한 줄로만 뽑으면 점수가 같을 때 늘 싼 쪽이 이기기 때문이다. */
  var at = bandOf(st.cat);
  var low = [], high = [];
  for(var n=0;n<pool.length;n++){
    if(pool[n].p.price[0] < at){ low.push(pool[n]); } else { high.push(pool[n]); }
  }
  var topLow = low.slice(0, 2);
  var topHigh = high.slice(0, 2);
  /* 한쪽이 비면 남은 쪽에서 더 채운다. 빈 줄을 보여 주는 것보다 낫다. */
  if(!topHigh.length){ topLow = low.slice(0, 3); }
  if(!topLow.length){ topHigh = high.slice(0, 3); }

  /* 나란히 비교 화면은 앞에서 세 개만 가져간다.
     그대로 이어 붙이면 싼 것 둘에 비싼 것 하나가 되므로 번갈아 놓는다. */
  var top = [];
  if(ranked){
    for(var z=0; z<Math.max(topLow.length, topHigh.length); z++){
      if(topLow[z]){ top.push(topLow[z]); }
      if(topHigh[z]){ top.push(topHigh[z]); }
    }
  } else {
    top = pool.slice(0);
  }

  return { list:pool, top:top, topLow:topLow, topHigh:topHigh,
           bandAt:at, lowCount:low.length, highCount:high.length,
           dropped:dropped, ranked:ranked, segTotal:segTotal,
           listed:listedFor(st),
           minPool:CONFIG.minPool || 12 };
}

/* 국가 자료만 있는 제품을 골라 온다.
   점수를 매기지 않는다. 가격도 전성분도 모르니 매길 재료가 없다.
   대신 식약처에 보고된 값(SPF·PA·pH 등)이 많이 적힌 것부터 보여 준다. */
function listedFor(st){
  var out = [];
  for(var i=0;i<CONFIG.products.length;i++){
    var p = CONFIG.products[i];
    if(p.tier !== 'listed'){ continue; }
    if(st.cell){ if(p.cell !== st.cell){ continue; } }
    else if(st.cat && p.cat !== st.cat){ continue; }
    out.push(p);
  }
  out.sort(function(x,y){
    var a = (x.specs || []).length, b = (y.specs || []).length;
    if(a !== b){ return b - a; }
    return (y.reportDate || '') > (x.reportDate || '') ? 1 : -1;
  });
  return out;
}

/* ============ 근거 문장 ============ */
function whyLines(m){
  var out = [];
  for(var i=0;i<m.reasons.length;i++){ out.push(m.reasons[i].t); }
  return out;
}

function gapLines(m, st){
  var out = [];
  var missed = [];
  for(var i=0;i<st.care.length;i++){
    if(!has(m.careHit, st.care[i])){ missed.push(st.care[i]); }
  }
  if(missed.length){
    out.push('이 제품이 겨냥하지 않는 고민이 남습니다 : ' + labelsOf(CONFIG.concerns, missed).join(', ') + '. 이 부분은 다른 단계에서 채우셔야 합니다.');
  }
  if(m.p.uv === '' && m.p.cat === 'sun' && has(st.avoid,'chem')){
    out.push('자외선 차단 방식이 표기로 확인되지 않았습니다. 유기자차를 피하신다면 구매 전 전성분을 직접 확인하세요.');
  }
  return out;
}

/* ============ 기피 성분 확인 상태 ============ */
/* 이 앱은 전성분 전체를 담고 있지 않습니다. 확인된 것만 확인됐다고 말하고,
   모르는 것은 모른다고 적는 편이 낫다고 봅니다. */
function avoidStatus(p, st){
  var out = [];
  var clean = p.clean || [];
  for(var i=0;i<st.avoid.length;i++){
    var id = st.avoid[i];
    var lab = labelOf(CONFIG.avoids, id);
    if(has(p.avoid, id)){ out.push({ id:id, label:lab, state:'in',  t:lab + ' 들어 있음' }); }
    else if(id === 'chem' && p.uv === 'mineral'){ out.push({ id:id, label:lab, state:'out', t:'무기자차만 쓴 제품' }); }
    else if(has(clean, id)){ out.push({ id:id, label:lab, state:'out', t:lab + ' 무첨가로 표기됨' }); }
    else { out.push({ id:id, label:lab, state:'unk', t:lab + ' 표기 확인 필요' }); }
  }
  return out;
}

/* ============ 후기 신뢰도 점수 ============ */
function checkScore(map){
  var sc = 0, max = 0;
  for(var i=0;i<CONFIG.checks.length;i++){
    var c = CONFIG.checks[i];
    max += c.w;
    var onv = !!map[c.id];
    if(c.inv){ if(!onv){ sc += c.w; } }
    else { if(onv){ sc += c.w; } }
  }
  var v = CONFIG.checkVerdict[CONFIG.checkVerdict.length-1];
  for(var j=0;j<CONFIG.checkVerdict.length;j++){
    if(sc >= CONFIG.checkVerdict[j].min){ v = CONFIG.checkVerdict[j]; break; }
  }
  return { score:sc, max:max, verdict:v };
}

        add(it, el('div','item-m', dateStr(rec.ts) + ' · ' + (rec.care.length ? labelsOf(CONFIG.concerns, rec.care).join(', ') : '고민 미선택')));
        on(it,'click',function(){
          var st = stateFromSaved(rec);
          S.cat = st.cat; S.skin = st.skin; S.care = st.care; S.avoid = st.avoid; S.budget = st.budget;
          S.result = runMatch(S);
          go('result');
        });
        add(hs, it);
      })(DB.saved[k]);
    }
    add(w, hs);
  }

  add(w, tabBar());
  return w;
}

/* ============ 조건 고르기 : 한 화면 ============ */
function renderPick(){
  var w = el('div','wrap');
  add(w, navBar(labelOf(CONFIG.cats, S.cat), 'home', null));

  var head = el('div','sec');
  add(head, el('h1','pg-t', '조건만 고르시면 됩니다'));
  add(head, el('p','pg-s', '피부 타입과 예산은 하나씩, 나머지는 여러 개 고를 수 있습니다. 안 고르셔도 결과는 나옵니다.'));
  add(w, head);

  /* 0 · 제형 : 클렌징처럼 서로 대체재가 아닌 제형이 섞인 카테고리에서만 나온다 */
  var segs = segsOf(S.cat);
  var stepN = 0;
  if(segs.length > 1){
    if(!S.seg){ S.seg = segs[0].id; }
    var s0 = el('div','sec');
    add(s0, el('p','tx-d mb10', '1 · 어떤 제형을 찾으세요'));
    add(s0, el('p','hint mb10',
      '클렌징 오일과 클렌징 폼은 서로 대신하는 물건이 아니라 같이 쓰는 물건입니다. 그래서 한 표에 섞어 줄을 세우지 않습니다. 찾으시는 제형을 먼저 골라 주세요.'));
    var slist = [];
    for(var si=0; si<segs.length; si++){
      slist.push({ id:segs[si].id, label:segs[si].label, h:segs[si].n + '개 확인됨' });
    }
    add(s0, chipRow(slist, S.seg, false, function(id){
      S.seg = id;
      render();
    }, null));
    add(w, s0);
    stepN = 1;
  }

  var s1 = el('div','sec');
  add(s1, el('p','tx-d mb10', (stepN+1) + ' · 피부 타입'));
  add(s1, chipRow(CONFIG.skins, S.skin, false, function(id){
    S.skin = (S.skin === id) ? null : id;
    render();
  }, null));
  add(w, s1);

  var s2 = el('div','sec');
  add(s2, el('p','tx-d mb10', (stepN+2) + ' · 지금 신경 쓰이는 것'));
  add(s2, chipRow(CONFIG.concerns, S.care, true, function(id){
    toggle(S.care, id);
    render();
  }, null));
  add(w, s2);

  var s3 = el('div','sec');
  add(s3, el('p','tx-d mb10', (stepN+3) + ' · 빼고 싶은 성분'));
  add(s3, el('p','hint mb10', '들어 있는 것으로 확인된 제품은 결과에서 빠집니다. 표기가 확인되지 않은 제품은 남기되 결과 화면에 모른다고 적어 드립니다.'));
  add(s3, chipRow(CONFIG.avoids, S.avoid, true, function(id){
    toggle(S.avoid, id);
    render();
  }, 'a'));
  add(w, s3);

  var s4 = el('div','sec');
  add(s4, el('p','tx-d mb10', (stepN+4) + ' · 예산'));
  add(s4, chipRow(CONFIG.budgets, S.budget, false, function(id){
    S.budget = (S.budget === id) ? null : id;
    render();
  }, null));
  add(w, s4);

  var preview = runMatch(S);
  var pv = el('div','sec');
  var pc = el('div','card card-p');
  add(pc, el('p','tx-b', preview.list.length + '개 제품이 조건을 통과했습니다'));
  if(preview.dropped.length){
    add(pc, el('p','hint mt10', preview.dropped.length + '개는 조건에 걸려 빠졌습니다. 결과 화면에서 무엇이 왜 빠졌는지 볼 수 있습니다.'));
  }
  if(!preview.ranked){
    add(pc, el('p','hint mt10',
      '이 구획에 확인된 제품이 ' + preview.segTotal + '개뿐이라 순위를 매기지 않습니다. 전부 나란히 보여 드리고 고르시는 건 대표님 몫으로 남깁니다.'));
  }
  add(pv, pc);
  add(w, pv);

  var foot = el('div','foot');
  var go1 = el('button','btn btn-d', preview.list.length ? '결과 보기' : '조건을 조금 풀어보세요');
  if(!preview.list.length){ go1.disabled = true; go1.className = 'btn btn-d btn-off'; }
  on(go1,'click',function(){
    S.result = runMatch(S);
    saveResult(S, S.result);
    go('result');
  });
  add(foot, go1);
  add(w, foot);

  return w;
}


/* ============ 결과 ============ */
function catGrad(catId){
  var c = byId(CONFIG.cats, catId);
  return c ? c.g : 'linear-gradient(140deg,#EEE,#CCC)';
}

function condSummary(){
  var box = el('button','cond');
  var line1 = [];
  if(S.skin){ line1.push(labelOf(CONFIG.skins, S.skin)); }
  if(S.care.length){ line1.push(labelsOf(CONFIG.concerns, S.care).join(', ')); }
  var b = byId(CONFIG.budgets, S.budget);
  if(b){ line1.push(b.label); }
  add(box, el('div','cond-t', line1.length ? line1.join('  |  ') : '조건 없이 전체 비교'));
  if(S.avoid.length){
    add(box, el('div','cond-s', '제외 : ' + labelsOf(CONFIG.avoids, S.avoid).join(', ')));
  }
  add(box, el('div','cond-e', CONFIG.copy.reset));
  on(box,'click',function(){ go('pick'); });
  return box;
}

function ingChips(m){
  var row = el('div','ings');
  var p = m.p;
  for(var i=0;i<m.hits.length;i++){
    (function(h){
      var cls = 'ing' + (h.matched.length ? ' hit' : '');
      var c = el('button', cls, h.ing.n);
      on(c,'click',function(){ S.focus = h.ing.id; go('ing'); });
      add(row, c);
    })(m.hits[i]);
  }
  var shown = {};
  for(var s2=0;s2<m.hits.length;s2++){ shown[m.hits[s2].ing.n] = 1; }
  var raw = p.raw || [];
  for(var j=0;j<raw.length;j++){
    if(shown[raw[j]]){ continue; }
    add(row, el('span','ing ing-r', raw[j]));
  }
  if(!m.hits.length && !raw.length){
    add(row, el('span','ing ing-r', '전성분 표기 확인 필요'));
  }
  return row;
}

function meter(score, best){
  var m = el('div','mtr');
  var i = el('i');
  var pct = best > 0 ? Math.round(Math.min(100, (score / best) * 100)) : 0;
  i.style.width = pct + '%';
  add(m, i);
  return m;
}

/* 칸마다 "이건 꼭 보고 산다"는 값을 줄지어 보여 줍니다.
   선크림이면 SPF와 PA, 클렌징이면 pH 같은 것들입니다.
   전부 식약처 보고 자료에서 그대로 온 값이라 AI가 손대지 않았습니다.
   값이 없으면 아무것도 적지 않습니다. 모르는 것을 채워 넣지 않습니다. */
function specRow(p){
  var sp = p.specs || [];
  if(!sp.length){ return null; }
  var box = el('div','spec');
  for(var i=0;i<sp.length;i++){
    var cell = el('div','spec-c');
    add(cell, el('div','spec-k', sp[i].k), el('div','spec-v', sp[i].v));
    add(box, cell);
  }
  return box;
}

/* 판매처로 가는 단추입니다. 특정 상품 페이지가 아니라 검색 결과로 보냅니다.
   상품 페이지 주소는 품절되면 죽지만, 이름으로 찾는 길은 늘 살아 있습니다.
   값과 사진은 파는 곳에서 직접 보시는 편이 정확합니다. */
function shopBtn(p){
  var row = el('div','shop-row mt14');
  var a1 = el('a','btn btn-o', '쿠팡에서 찾기');
  a1.href = CONFIG.shopLinkCoupang(p);
  a1.target = '_blank';
  a1.rel = 'noopener noreferrer';
  var a2 = el('a','btn btn-o', '네이버에서 찾기');
  a2.href = CONFIG.shopLink(p);
  a2.target = '_blank';
  a2.rel = 'noopener noreferrer';
  add(row, a1, a2);
  return row;
}

/* 국가 자료만 있는 제품 카드입니다.
   점수도 순위도 없습니다. 없는 것을 있는 척하지 않기 위해서입니다. */
function listedCard(p){
  var card = el('div','prod prod-lst');
  add(card, el('div','badge-lst', '국가 자료로 확인'));

  var h = el('div','prod-h');
  var sw = el('div','prod-sw');
  sw.style.background = catGrad(p.cat);
  var info = el('div','prod-i');
  add(info, el('div','prod-br', p.brand || p.entp),
            el('div','prod-nm', p.name),
            el('div','prod-pr', '값은 판매처마다 다릅니다'));
  add(h, sw, info);
  add(card, h);

  var sr = specRow(p);
  if(sr){ add(card, sr); }
  if(p.good){ add(card, el('p','tx-s mt14', p.good)); }

  if(p.watch){
    var wb = el('div','watch');
    add(wb, el('div','watch-t', '사기 전에 확인할 것'), el('p','tx-s', p.watch));
    add(card, wb);
  }

  var nb = el('div','card card-w mt14');
  add(nb, el('p','tx-s',
    '이 제품은 전성분과 값을 아직 사람이 확인하지 못했습니다. ' +
    '그래서 대표님 조건과 하나씩 대조하지 못했고, 점수도 매기지 않았습니다. ' +
    '위에 적힌 값은 식약처에 보고된 내용 그대로입니다.'));
  add(card, nb);

  add(card, shopBtn(p));
  add(card, el('p','hint mt14', '제품 이름은 생성형 AI가 다듬었습니다. 위 숫자는 원본 그대로입니다.'));
  add(card, el('p','hint mt14', '확인한 곳 : 식품의약품안전처 기능성화장품 보고품목정보' +
    (p.reportDate ? ' · ' + p.reportDate + ' 보고' : '') +
    (p.checked ? ' · ' + p.checked + ' 확인' : '')));
  return card;
}

function productCard(m, rank, best, showRank){
  var p = m.p;
  var card = el('div','prod' + (rank === 1 ? ' rank1' : ''));

  if(showRank && rank === 1){
    add(card, el('div','badge1', m.badge ? m.badge
      : (m.tie ? '동점 · 그중 가장 저렴함' : '조건에 가장 가까움')));
  }

  var h = el('div','prod-h');
  var sw = el('div','prod-sw');
  sw.style.background = catGrad(p.cat);
  var info = el('div','prod-i');
  add(info, el('div','prod-br', p.brand), el('div','prod-nm', p.name), el('div','prod-pr', priceText(p) + (p.vol ? '  ·  ' + p.vol : '')));
  add(h, sw, info);
  add(card, h);

  var rk = el('div','prod-rk');
  add(rk, el('span','prod-rk-n', showRank ? ('후보 ' + rank) : '적합도'), el('span','prod-rk-s', '적합 점수 ' + m.score + '점'));
  add(card, rk, meter(m.score, best));

  if(p.fnc){
    add(card, el('div','fnc', '식약처 ' + p.fnc + ' 기능성'));
  }
  var sr0 = specRow(p);
  if(sr0){ add(card, sr0); }

  var why = el('div','prod-why');
  add(why, el('div','prod-why-t', '왜 이 제품인가'));
  var lines = whyLines(m);
  if(!lines.length){
    add(why, el('p','tx-s', '고르신 조건과 직접 겹치는 항목이 없습니다. 조건을 통과했다는 점만 확인된 상태입니다.'));
  }
  for(var i=0;i<lines.length;i++){
    var row = el('div','why-r');
    add(row, el('span','why-d'), el('p','tx-s', lines[i]));
    add(why, row);
  }
  add(card, why);

  add(card, ingChips(m));

  if(p.good){
    add(card, el('p','tx-s mt14', p.good));
  }

  var av = avoidStatus(p, S);
  if(av.length){
    var ab = el('div','avb');
    add(ab, el('div','avb-t', '빼달라고 하신 성분'));
    var arow = el('div','ings');
    for(var v=0;v<av.length;v++){
      add(arow, el('span','ing av-' + av[v].state, av[v].t));
    }
    add(ab, arow);
    var unk = 0;
    for(var u=0;u<av.length;u++){ if(av[u].state === 'unk'){ unk++; } }
    if(unk){
      add(ab, el('p','hint mt10', '표기 확인 필요는 이 앱이 모른다는 뜻입니다. 판매 페이지 전성분에서 직접 보시거나, AI 질문문에 넣어 물어보세요.'));
    }
    add(card, ab);
  }

  var gaps = gapLines(m, S);
  var wbox = el('div','watch');
  add(wbox, el('div','watch-t', '사기 전에 확인할 것'));
  if(p.watch){ add(wbox, el('p','tx-s', p.watch)); }
  for(var g=0;g<gaps.length;g++){
    add(wbox, el('p','tx-s mt10', gaps[g]));
  }
  add(card, wbox);

  add(card, shopBtn(p));
  add(card, el('p','hint mt14', '확인한 곳 : ' + srcName(p.src) + ' · ' + CONFIG.dataAsOf + ' 기준'));
  return card;
}

/* 출처는 제품마다 긴 문장을 적지 않고 짧은 이름만 담아 둡니다.
   같은 문장을 천 번 적으면 그것만으로 파일이 무거워지기 때문입니다. */
function srcName(key){
  if(key === 'mfds'){ return '식품의약품안전처 기능성화장품 보고품목정보'; }
  if(key === 'oliveyoung'){ return '올리브영 상품정보 고시(화장품법 제10조)'; }
  return key || '확인 중';
}

function renderResult(){
  var w = el('div','wrap');
  add(w, navBar('고른 결과', 'pick', null));

  if(!S.result){ S.result = runMatch(S); }
  var res = S.result;

  var segLabel = '';
  var sgs = segsOf(S.cat);
  for(var sx=0; sx<sgs.length; sx++){ if(sgs[sx].id === S.seg){ segLabel = sgs[sx].label; } }

  var head = el('div','sec');
  var title;
  if(!res.top.length){ title = CONFIG.copy.noMatch; }
  else if(!res.ranked){ title = '조건을 통과한 ' + res.top.length + '개를 전부 보여 드립니다'; }
  else if(res.topLow.length && res.topHigh.length){ title = '값이 다른 두 갈래로 좁혔습니다'; }
  else { title = '이 ' + res.top.length + '개로 좁혔습니다'; }
  add(head, el('h1','pg-t', title));
  if(res.ranked){
    add(head, el('p','pg-s', labelOf(CONFIG.cats, S.cat) + (segLabel ? ' · ' + segLabel : '') +
      ' ' + res.segTotal + '개 가운데 조건을 통과한 ' + res.list.length + '개를 점수로 줄 세운 결과입니다.'));
  } else {
    add(head, el('p','pg-s', labelOf(CONFIG.cats, S.cat) + (segLabel ? ' · ' + segLabel : '') +
      ' 구획에 확인된 제품이 ' + res.segTotal + '개입니다. ' + res.minPool +
      '개보다 적으면 순위를 붙이지 않는 것이 이 앱의 규칙입니다.'));
    var nb = el('div','card card-w mt14');
    add(nb, el('p','tx-b', '왜 순위를 안 매기나'));
    add(nb, el('p','tx-s mt10',
      '고를 수 있는 것이 몇 개 없는데 1위 2위를 붙이면, 고른 것이 아니라 남은 것을 순위처럼 보여 주는 셈이 됩니다. 그건 대표님을 속이는 일이라 하지 않습니다. 이 구획은 데이터를 더 채우는 중이고, 그때까지는 전부 나란히 보여 드립니다.'));
    add(head, nb);
  }
  add(head, condSummary());
  add(w, head);

  if(!res.top.length){
    var em = el('div','sec');
    var ec = el('div','card card-w');
    add(ec, el('p','tx-b', '조건이 서로 부딪칩니다'));
    add(ec, el('p','tx-s mt10', '빼고 싶은 성분이나 예산 중 하나를 풀면 결과가 나옵니다. 아래에서 무엇이 왜 빠졌는지 확인하시고 조건을 조정하세요.'));
    var eb = el('button','btn btn-o mt14', '조건 다시 고르기');
    on(eb,'click',function(){ go('pick'); });
    add(ec, eb);
    add(em, ec);
    add(w, em);
  }

  var best = 1;
  for(var q=0;q<res.top.length;q++){
    if(res.top[q].score > best){ best = res.top[q].score; }
    res.top[q].tie = false;
  }

  if(res.ranked && res.topLow.length && res.topHigh.length){
    /* 값이 다른 두 줄. 어느 쪽이 위라는 뜻이 아니라 쓰는 사람이 다르다는 뜻이다. */
    var bandNote = el('div','sec');
    add(bandNote, el('p','hint',
      wonText(res.bandAt) + '을 기준으로 두 갈래로 나눠서 각각 뽑았습니다. ' +
      '싼 쪽 ' + res.lowCount + '개, 값이 나가는 쪽 ' + res.highCount + '개가 조건을 통과했습니다. ' +
      '어느 쪽이 더 좋다는 뜻이 아니라, 쓰는 사람이 다르다는 뜻입니다.'));
    add(w, bandNote);

    var secLow = el('div','sec');
    add(secLow, el('p','tx-b mb10', wonText(res.bandAt) + ' 아래에서 고른 것'));
    add(secLow, el('p','hint mb10', '올리브영 · 온라인에서 흔히 보이는 값입니다.'));
    for(var i=0;i<res.topLow.length;i++){
      res.topLow[i].badge = (i === 0) ? '이 값대에서 조건에 가장 가까움' : '';
      add(secLow, productCard(res.topLow[i], i+1, best, true));
    }
    add(w, secLow);

    var secHigh = el('div','sec');
    add(secHigh, el('p','tx-b mb10', wonText(res.bandAt) + ' 위에서 고른 것'));
    add(secHigh, el('p','hint mb10', '백화점 · 더모 라인이 주로 이 구간입니다. 값이 비싸다고 더 맞는 것은 아닙니다.'));
    for(var i2=0;i2<res.topHigh.length;i2++){
      res.topHigh[i2].badge = (i2 === 0) ? '이 값대에서 조건에 가장 가까움' : '';
      add(secHigh, productCard(res.topHigh[i2], i2+1, best, true));
    }
    add(w, secHigh);
  } else {
    var only = el('div','sec');
    if(res.ranked && res.list.length){
      var side = res.topHigh.length ? '값이 나가는 쪽' : '싼 쪽';
      add(only, el('p','hint mb10',
        wonText(res.bandAt) + '을 기준으로 나누려 했지만 ' + side + '에만 후보가 있습니다. ' +
        '한 줄로만 보여 드립니다.'));
    }
    for(var i3=0;i3<res.top.length;i3++){

      res.ranked ? '세 개를 나란히 놓고 보기' : '나란히 놓고 보기');

    on(b3,'click',function(){ go('check'); });

    var cap = Math.min(res.listed.length, S.listedMore ? res.listed.length : 6);

      on(mb2,'click',function(){ S.listedMore = true; render(); });

  if(res.dropped.length){

    add(dp, el('p','hint mb10', '왜 빠졌는지 밝혀 두는 편이 낫다고 봅니다. 조건을 바꾸면 다시 들어옵니다.'));
    for(var k=0;k<res.dropped.length;k++){

  return w;
}

  return w;
}

/* ============ 복사 ============ */
function copyText(str, okMsg){
  var done = false;
  try{
    var ta = document.createElement('textarea');
    ta.value = str;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, str.length);
    done = document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ done = false; }
  if(!done && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str);
    done = true;
  }
  toast(done ? okMsg : '복사가 안 되면 아래 글을 길게 눌러 직접 복사하세요');
  return done;
}

  var ai = el('div','sec');
  var aiBox = el('div','card card-w');
  add(aiBox, el('p','tx-b', '생성형 AI를 어디에 쓰는지'));
  add(aiBox, el('p','tx-s mt10', CONFIG.aiNotice));
  add(ai, aiBox);
  add(w, ai);

  var s1 = el('div','sec');
  var c1 = el('div','card card-p mb10');
  add(c1, el('p','tx-b', '담긴 제품'));
  add(c1, el('p','tx-s mt10', CONFIG.products.length + '개입니다. 스킨케어와 선크림, 클렌징으로 범위를 좁혔습니다. 성분 구성이 결과를 가르는 영역이라 조건과 대조하는 방식이 성립하기 때문입니다. 색조는 개인 톤과 취향이 지배해서 앱이 제품을 특정하면 틀리기 쉬워 넣지 않았습니다.'));
  add(s1, c1);

  var c2 = el('div','card card-p mb10');
  add(c2, el('p','tx-b', '확인한 곳'));
  add(c2, el('p','tx-s mt10', CONFIG.legal.data));
  add(s1, c2);

  var c3 = el('div','card card-p mb10');
  add(c3, el('p','tx-b', '기능성 표기'));
  add(c3, el('p','tx-s mt10', CONFIG.legal.fnc));
  add(s1, c3);

  var cv = el('div','card card-p mb10');
  add(cv, el('p','tx-b', '정보 기준일'));
  add(cv, el('p','tx-s mt10',
    '지금 보고 계신 제품 정보는 ' + CONFIG.dataVersion + ' 기준입니다. ' +
    (DATA_STATE === 'live'
      ? '앱을 열 때 최신 데이터를 내려받았습니다.'
      : '최신 데이터를 내려받지 못해 앱에 들어 있는 ' + CONFIG.dataVersion + ' 자료로 보여 드리고 있습니다.') +
    ' 화장품은 리뉴얼되면 전성분이 바뀝니다. 구매 직전에는 제품 뒷면 표기를 한 번 더 확인하세요.'));
  add(s1, cv);

  var cf = el('div','card card-p mb10');
  add(cf, el('p','tx-b', '전성분을 어떻게 확인했나'));
  add(cf, el('p','tx-s mt10',
    '클렌징 항목은 화장품법 제10조에 따라 판매처가 의무로 공개하는 성분 표기 원문을 그대로 옮긴 뒤, 향료와 알코올, 각질 성분이 있는지를 그 원문에서 직접 찾아 표시했습니다. 제조사 홍보 문구가 아니라 법정 표기가 근거입니다. 무첨가라고 적힌 항목은 전성분 전체를 확인한 결과입니다.'));
  add(cf, el('p','tx-s mt10',
    '아직 원문을 확인하지 못한 다른 카테고리 제품은 판매처와 브랜드 공식몰 표기를 기준으로 하며, 무첨가 여부를 단정하지 않습니다.'));
  add(s1, cf);

  var c4 = el('div','card card-p mb10');
  add(c4, el('p','tx-b', '못 하는 것'));
  add(c4, el('p','tx-s mt10', '실시간 가격과 재고는 알지 못합니다. 가격은 확인한 날의 판매처 표시가이고, 그날 이후 바뀌었을 수 있습니다. 대신 조건을 정리해 AI에게 물을 질문문을 만들어 드립니다.'));
  add(s1, c4);

  var c5 = el('div','card card-g mb10');
  add(c5, el('p','tx-b', '광고'));
  add(c5, el('p','tx-s mt10', CONFIG.legal.ad));
  add(s1, c5);

  var c6 = el('div','card card-p');
  add(c6, el('p','tx-b', '내 정보'));
  add(c6, el('p','tx-s mt10', CONFIG.legal.device));
  add(s1, c6);
  add(w, s1);

  var s2 = el('div','sec');
  var b1 = el('button','btn btn-o mb10', '처음 화면 다시 보기');
  on(b1,'click',function(){ go('intro'); });
  add(s2, b1);

  var b2 = el('button','btn btn-s mb10', '저장된 기록 전부 지우기');
  on(b2,'click',function(){
    DB.saved = []; DB.notes = [];
    saveDB();
    toast('기록을 모두 지웠습니다');
    render();
  });
  add(s2, b2);

  var b3 = el('button','btn btn-s', '앱 종료');
  on(b3,'click',function(){ showExit(); });
  add(s2, b3);
  add(w, s2);

  var f = el('div','sec');
  add(f, el('p','hint', CONFIG.appName + ' ' + CONFIG.version + ' · ' + CONFIG.updatedAt + ' · 생각콩'));
  add(f, el('p','hint mt10', CONFIG.legal.claim));
  add(w, f);

  add(w, tabBar());
  return w;
}

/* ============ AI 이용 안내 (앱인토스 고지 의무 : 첫 사용 시 안내) ============
   인트로 화면을 무겁게 만들지 않으려고, 본화면에 들어온 직후 딱 한 번만 뜬다.
   확인을 누르면 다시 뜨지 않고, 자세한 내용은 정보 탭에 항상 남아 있다. */
var aiNoticeOpen = false;
var aiNoticeNode = null;
function showAiNotice(){
  if(!CONFIG.aiNotice || aiNoticeOpen){ return; }
  aiNoticeOpen = true;
  var mask = el('div','mask');
  aiNoticeNode = mask;
  var sheet = el('div','sheet');
  add(sheet, el('div','sheet-t', 'AI 이용 안내'));
  add(sheet, el('p','tx-s mb16', CONFIG.aiNotice));
  var y = el('button','btn btn-d', '확인');
  on(y,'click',function(){ closeAiNotice(); });
  add(sheet, y);
  add(mask, sheet);
  document.body.appendChild(mask);
}
function closeAiNotice(){
  aiNoticeOpen = false;
  if(aiNoticeNode && aiNoticeNode.parentNode){ aiNoticeNode.parentNode.removeChild(aiNoticeNode); }
  aiNoticeNode = null;
  DB.aiSeen = true;
  saveDB();
}

/* ============ 종료 확인 ============ */
var exitOpen = false;
var exitNode = null;
function closeExit(){
  exitOpen = false;
  if(exitNode && exitNode.parentNode){ exitNode.parentNode.removeChild(exitNode); }
  exitNode = null;
}
function showExit(){
  if(exitOpen){ return; }
  exitOpen = true;
  var mask = el('div','mask');
  mask.id = 'exitmask';
  exitNode = mask;
  var sheet = el('div','sheet');
  add(sheet, el('div','sheet-t', '앱을 종료할까요'));
  add(sheet, el('p','tx-s mb16', '고르신 조건과 기록은 이 기기에 그대로 남습니다. 다시 여시면 이어서 쓰실 수 있습니다.'));
  var y = el('button','btn btn-d mb10', '종료하기');
  on(y,'click',function(){
    closeExit();
    try{ window.close(); }catch(e){ }
    toast('브라우저에서 직접 닫아 주세요');
  });
  var n = el('button','btn btn-o', '계속 쓰기');
  on(n,'click',function(){ closeExit(); });
  add(sheet, y, n);
  on(mask,'click',function(ev){ if(ev.target === mask){ closeExit(); } });
  add(mask, sheet);
  document.body.appendChild(mask);
}

/* ============ 렌더 ============ */
function render(){
  clear(R);
  var v = S.view;
  var node;
  if(v === 'intro'){ node = renderIntro(); }
  else if(v === 'cell'){ node = renderCells(); }
  else if(v === 'pick'){ node = renderPick(); }
  else if(v === 'result'){ node = renderResult(); }
  else if(v === 'cmp'){ node = renderCompare(); }
  else if(v === 'prompt'){ node = renderPrompt(); }
  else if(v === 'check'){ node = renderCheck(); }
  else if(v === 'ing'){ node = renderIng(); }
  else if(v === 'hist'){ node = renderHist(); }
  else if(v === 'data'){ node = renderData(); }
  else { node = renderHome(); }
  add(R, node);
}

/* ============ 뒤로가기 ============ */
var BACKMAP = { cell:'home', pick:'cell', result:'pick', cmp:'result', prompt:'result',
                check:'home', ing:'home', hist:'home', data:'home', intro:'home' };
function handleBack(){
  if(exitOpen){ closeExit(); return; }
  if(S.view === 'home'){ showExit(); return; }
  go(BACKMAP[S.view] || 'home');
}

/* ============ 데이터 불러오기 ============
   앱 껍데기와 제품 데이터를 나눠 둡니다.
   같은 폴더의 products.json 을 먼저 시도하고, 실패하면 앱에 들어 있는 스냅샷으로 그대로 갑니다.
   어느 쪽을 쓰고 있는지는 정보 화면에 적습니다. */
var DATA_STATE = 'snapshot';

function loadData(done){
  var fin = function(state){
    if(DATA_STATE !== 'pending'){ return; }
    DATA_STATE = state;
    done();
  };
  DATA_STATE = 'pending';
  var timer = setTimeout(function(){ fin('snapshot'); }, 3500);
  try{
    fetch('products.json', { cache:'no-store' }).then(function(r){
      if(!r.ok){ throw new Error('http'); }
      return r.json();
    }).then(function(j){
      clearTimeout(timer);
      if(j && j.products && j.products.length){
        if(j.minPool){ CONFIG.minPool = j.minPool; }
        if(j.cells){ CONFIG.applyCells(j.cells); }
        if(j.aiNote){ CONFIG.aiNote = j.aiNote; }
        CONFIG.applyData(j.products, j.version);
        fin('live');
      } else {
        fin('snapshot');
      }
    })['catch'](function(){
      clearTimeout(timer);
      fin('snapshot');
    });
  }catch(e){
    clearTimeout(timer);
    fin('snapshot');
  }
}

/* ============ 시작 ============ */
function boot(){
  loadDB();
  S.view = DB.seen ? 'home' : 'intro';
  render();
  /* 인트로를 건너뛰고 바로 본화면으로 오는 재방문자인데 AI 고지를 본 적이 없으면 여기서 띄운다. */
  if(DB.seen && !DB.aiSeen){ showAiNotice(); }
  loadData(function(){ render(); });
  try{
    window.history.pushState({ pm:1 }, '', '');
    window.addEventListener('popstate', function(){
      handleBack();
      window.history.pushState({ pm:1 }, '', '');
    });
  }catch(e){ }
}

if(typeof document !== 'undefined' && document.body){ boot(); }
else if(typeof document !== 'undefined'){ document.addEventListener('DOMContentLoaded', boot); }

})();
</script>
